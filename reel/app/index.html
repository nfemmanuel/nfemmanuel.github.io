<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reel — four types, no jargon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   LIGHT: colour is PAINT — soft tinted fills, ink on tint.
   DARK : colour is LIGHT — near-black cards, hue emitted as
          glowing text and a luminous edge. Not an inversion;
          a different physics for a different ground.
   Android → Material 3 Expressive · iOS → Liquid Glass
   ══════════════════════════════════════════════════════════════ */
:root{
  --ground:#F6F6F7; --surf:#FFF; --ink:#14161A; --ink-2:#5C636D; --ink-3:#8B929C; --hair:#E7E8EB;
  --c-txt:#B4761C;  --t-txt:#FBF2E2;   /* Text   */
  --c-img:#7B55B4;  --t-img:#F0EAF9;   /* Images */
  --c-doc:#356BA6;  --t-doc:#E6EFF8;   /* Docs   */
  --c-lnk:#BA5138;  --t-lnk:#FAEAE5;   /* Links  */
  --edge:0 0 0 0 transparent;
  --shadow-s:0 1px 2px rgba(16,20,26,.05),0 4px 12px rgba(16,20,26,.05);
  --shadow-m:0 2px 6px rgba(16,20,26,.07),0 14px 34px rgba(16,20,26,.09);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --ui:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  --spring:cubic-bezier(.34,1.56,.5,1); --glide:cubic-bezier(.2,.85,.3,1);
}
/* ── dark: OLED ground, emissive hue ── */
.dark{
  --ground:#000; --surf:#101114; --ink:#F2F3F5; --ink-2:#9AA1AB; --ink-3:#6B727C; --hair:#22242A;
  --c-txt:#FFC14D; --t-txt:#000;
  --c-img:#C79BFF; --t-img:#000;
  --c-doc:#6FB4FF; --t-doc:#000;
  --c-lnk:#FF8A66; --t-lnk:#000;
  --shadow-s:none; --shadow-m:0 16px 40px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);
  display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}

header{padding:14px 16px 0;flex:0 0 auto}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1.pt{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.035em;margin:0}
.lede{font-size:12.5px;color:var(--ink-2);margin:5px 0 0;line-height:1.5;max-width:62ch}
.lede b{color:var(--ink);font-weight:600}
.ctrls{display:flex;gap:7px;margin-left:auto}
.seg{display:flex;background:var(--surf);border:1px solid var(--hair);border-radius:99px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:500;
  color:var(--ink-3);padding:6px 13px;border-radius:99px;cursor:pointer;transition:.2s var(--glide)}
.seg button[data-on="1"]{background:var(--ink);color:var(--ground)}
.rail{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;flex:0 0 auto}
.rail::-webkit-scrollbar{display:none}
.rail button{appearance:none;border:1px solid var(--hair);background:var(--surf);font:inherit;font-size:12.5px;
  font-weight:500;color:var(--ink-2);padding:7px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;
  flex:0 0 auto;transition:.22s var(--spring)}
.rail button[data-on="1"]{background:var(--ink);color:var(--ground);border-color:var(--ink);transform:scale(1.04)}
.cap{font-size:12.5px;color:var(--ink-2);padding:0 16px 10px;line-height:1.5;flex:0 0 auto}
.stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;padding:0 12px 14px}
.phone{position:relative;width:100%;max-width:392px;height:min(70vh,100%);border-radius:30px;overflow:hidden;
  background:var(--ground);box-shadow:var(--shadow-m);border:1px solid var(--hair)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ground)}
@media (min-width:900px){
  body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:0 32px;padding:28px}
  header,.rail{flex-basis:100%;max-width:860px;padding-inline:0}
  .cap{display:none}
  .stage{flex:0 0 auto;height:auto;padding:18px 0 0}
  .phone{width:376px;height:752px;border-radius:42px;border:9px solid #0B0C0E}
  .notes{display:block;flex:0 0 296px;max-width:330px;padding-top:18px;font-size:12.5px;color:var(--ink-2);line-height:1.65}
  .notes h3{font-family:var(--display);font-size:13px;font-weight:700;color:var(--ink);margin:0 0 6px;letter-spacing:-.02em}
  .notes p{margin:0 0 15px} .notes b{color:var(--ink);font-weight:600}
}
.notes{display:none}

/* ═══ in-phone ═══ */
.sbar{height:36px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:12px;font-weight:600}
.roll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none;padding-bottom:96px}
.roll::-webkit-scrollbar{display:none}
.big{font-family:var(--display);letter-spacing:-.04em;line-height:.95;margin:0}
.sub{color:var(--ink-3);font-size:13px;margin-top:6px;padding:0 20px}
.sect{font-size:12px;font-weight:600;color:var(--ink-3);padding:20px 20px 10px}

/* ── the search field is now the hero: no FAB competes with it ── */
.hunt{margin:14px 16px 4px;display:flex;align-items:center;gap:12px;cursor:pointer;
  transition:transform .3s var(--spring)}
.hunt:active{transform:scale(.985)}
.md .hunt{height:58px;border-radius:29px;background:var(--surf);padding:0 20px;box-shadow:var(--shadow-s);
  font-size:16px;color:var(--ink-3)}
.ios .hunt{height:44px;border-radius:13px;padding:0 14px;font-size:16px;color:var(--ink-3);
  background:color-mix(in srgb,var(--surf) 74%,transparent);
  backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
  border:.5px solid var(--hair)}
.dark .md .hunt{border:1px solid var(--hair)}

/* ── cards: paint in light, light in dark ── */
.card{background:var(--surf);box-shadow:var(--shadow-s);cursor:pointer;overflow:hidden;position:relative;
  margin:0 16px 11px;transition:transform .3s var(--spring)}
.card:active{transform:scale(.975)}
.md .card{border-radius:22px} .ios .card{border-radius:16px}
.dark .card{border:1px solid var(--hair)}
.card .in{padding:14px 15px}
.card .val{font-size:15.5px;line-height:1.45;font-weight:450;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .val.code{font-family:var(--mono);font-size:14px;letter-spacing:-.01em}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:11.5px}
.card .tagl{padding:3px 9px;border-radius:99px;font-size:10.5px;font-weight:600}
.card .when{color:var(--ink-3)}
/* emissive edge — dark only */
.dark .card[data-c]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px}
.dark .card[data-c=txt]::before{background:var(--c-txt);box-shadow:0 0 14px 1px var(--c-txt)}
.dark .card[data-c=img]::before{background:var(--c-img);box-shadow:0 0 14px 1px var(--c-img)}
.dark .card[data-c=doc]::before{background:var(--c-doc);box-shadow:0 0 14px 1px var(--c-doc)}
.dark .card[data-c=lnk]::before{background:var(--c-lnk);box-shadow:0 0 14px 1px var(--c-lnk)}
.dark .card .tagl{background:transparent;border:1px solid currentColor;opacity:.85}
.pin{position:absolute;top:11px;right:11px;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center}

/* ── type tiles ── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0 16px}
.tile{padding:15px 14px 13px;cursor:pointer;position:relative;overflow:hidden;display:flex;
  flex-direction:column;min-height:126px;transition:transform .34s var(--spring)}
.tile:active{transform:scale(.965)}
.md .tile{border-radius:26px} .ios .tile{border-radius:18px}
.tile .glyph{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px}
.tile .n{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.03em;margin-top:auto}
.tile .c{font-size:12px;font-weight:500;opacity:.72;margin-top:2px}
.dark .tile{background:var(--surf)!important;border:1px solid var(--hair)}
.dark .tile .glyph{background:transparent!important;border:1px solid currentColor}
.dark .tile::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:currentColor;
  opacity:.9;filter:blur(.3px);box-shadow:0 0 16px 1px currentColor}

/* ── nav ── */
.md .nav{position:absolute;left:12px;right:12px;bottom:14px;height:66px;background:var(--surf);
  border-radius:33px;display:flex;align-items:center;box-shadow:var(--shadow-m);padding:0 6px}
.dark .md .nav{border:1px solid var(--hair)}
.md .nav .n{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;
  font-weight:500;color:var(--ink-3);cursor:pointer}
.md .nav .n .pill{padding:5px 20px;border-radius:99px;transition:.34s var(--spring)}
.md .nav .n[data-on="1"]{color:var(--ink)}
.md .nav .n[data-on="1"] .pill{background:var(--hair)}
.ios .nav{position:absolute;left:16px;right:16px;bottom:16px;height:58px;border-radius:26px;display:flex;
  align-items:center;padding:0 4px;background:color-mix(in srgb,var(--surf) 66%,transparent);
  backdrop-filter:blur(30px) saturate(1.9);-webkit-backdrop-filter:blur(30px) saturate(1.9);
  border:.5px solid color-mix(in srgb,#fff 20%,transparent);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.ios .nav .n{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;
  font-weight:500;color:var(--ink-3);cursor:pointer}
.ios .nav .n[data-on="1"]{color:var(--ink)}
/* toolbar: where manual add now lives — secondary, where it belongs */
.tbar{position:absolute;top:36px;left:0;right:0;height:46px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;z-index:4}
/* Android has no Liquid Glass, so it needs a real surface or content collides with it */
.md .tbar{background:linear-gradient(var(--ground) 62%,transparent)}
.ios .tbar{background:color-mix(in srgb,var(--ground) 60%,transparent);
  backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8)}
.tbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surf);border:1px solid var(--hair);cursor:pointer;color:var(--ink-2)}
.ios .tbtn{background:color-mix(in srgb,var(--surf) 70%,transparent);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border:.5px solid var(--hair)}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--surf);animation:rise .38s var(--spring)}
.md .sheet{border-radius:30px 30px 0 0;padding:10px 0 22px}
.ios .sheet{border-radius:14px 14px 0 0;padding:8px 0 20px;
  background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.dark .sheet{border-top:1px solid var(--hair)}
@keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.grip{width:36px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 14px}
.act{margin:0 16px;height:52px;display:flex;align-items:center;justify-content:center;gap:9px;
  font-weight:600;font-size:16px;cursor:pointer;transition:transform .3s var(--spring)}
.act:active{transform:scale(.97)}
.md .act{border-radius:26px} .ios .act{border-radius:14px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 20px;font-size:15px;cursor:pointer}
.opt+.opt{border-top:1px solid var(--hair)}
.opt .t{flex:1} .opt .v{color:var(--ink-3);font-size:13.5px}
.gauge{margin:0 16px 11px;padding:15px 16px;background:var(--surf);box-shadow:var(--shadow-s)}
.dark .gauge{border:1px solid var(--hair)}
.md .gauge{border-radius:24px} .ios .gauge{border-radius:16px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline}
.gauge .num{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.04em}
.gauge .num i{font-style:normal;color:var(--ink-3);font-size:15px;font-weight:500}
.gauge .track{height:6px;border-radius:99px;background:var(--hair);margin-top:11px;overflow:hidden}
.gauge .track i{display:block;height:100%;border-radius:99px;animation:grow .7s var(--spring)}
@keyframes grow{from{width:0!important}}
.stag>*{animation:pop .42s both var(--spring)}
.stag>*:nth-child(1){animation-delay:.01s}.stag>*:nth-child(2){animation-delay:.04s}
.stag>*:nth-child(3){animation-delay:.07s}.stag>*:nth-child(4){animation-delay:.1s}
.stag>*:nth-child(5){animation-delay:.13s}.stag>*:nth-child(n+6){animation-delay:.16s}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg{display:block}
</style>
</head>
<body class="md">

<header>
  <div class="hrow">
    <h1 class="pt">Reel</h1>
    <div class="ctrls"><div class="seg" id="platSeg"></div><div class="seg" id="themeSeg"></div></div>
  </div>
  <p class="lede">Three fixes: the <b>plus button is gone</b> — manual typing is the rarest way things get in here, so it no longer owns the loudest spot. <b>"Snippets" is gone</b> — collections are now just the four types. And <b>dark mode has its own physics</b>: colour stops being paint and starts being light.</p>
</header>

<nav class="rail" id="rail"></nav>
<div class="cap" id="cap"></div>
<div class="stage"><div class="phone"><div class="scr" id="scr"></div></div></div>
<aside class="notes" id="notes"></aside>

<script>
'use strict';
const I={
  txt:'<path d="M5 5.5h14M5 12h14M5 18.5h9"/>',
  img:'<rect x="3.5" y="5.5" width="17" height="13" rx="2.6"/><circle cx="8.7" cy="10.2" r="1.5"/><path d="m4.5 16.4 4-4a1.6 1.6 0 0 1 2.2 0l2.3 2.3M13.6 15.4l2-2a1.6 1.6 0 0 1 2.2 0l1.7 1.7"/>',
  doc:'<path d="M6.5 3h7L18 7.5V21H6.5z"/><path d="M13.3 3v4.6H18"/>',
  lnk:'<path d="M10.4 13.6a4.1 4.1 0 0 0 5.8 0l2.3-2.3a4.1 4.1 0 0 0-5.8-5.8l-1.2 1.2"/><path d="M13.6 10.4a4.1 4.1 0 0 0-5.8 0l-2.3 2.3a4.1 4.1 0 0 0 5.8 5.8l1.2-1.2"/>',
  pin:'<path d="M9.5 3h5v5.6l2.3 3.1v2.1H7.2v-2.1L9.5 8.6z"/><path d="M12 13.8V21"/>',
  find:'<circle cx="11" cy="11" r="6.4"/><path d="m15.6 15.6 4 4"/>',
  add:'<path d="M12 5.6v12.8M5.6 12h12.8"/>',
  cog:'<circle cx="12" cy="12" r="3.1"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.4 5.4 7.2 7.2M16.8 16.8l1.8 1.8M18.6 5.4 16.8 7.2M7.2 16.8l-1.8 1.8"/>',
  key:'<rect x="2.6" y="6.4" width="18.8" height="11.2" rx="2.4"/><path d="M6.4 10h.01M9.8 10h.01M13.2 10h.01M16.6 10h.01M6.4 13.4h.01M9.8 13.4h.01M13.2 13.4h.01M16.6 13.4h.01M9 16.4h6"/>',
  bolt:'<path d="M13.2 2.5 5 13.4h5.5L9.8 21.5 18.5 10h-5.6z"/>',
  send:'<path d="M12 15.6V3.4"/><path d="m8.4 6.8 3.6-3.4 3.6 3.4"/><path d="M6.8 10.6H5.2v10h13.6v-10h-1.6"/>',
  copy:'<rect x="8.6" y="8.6" width="12.4" height="12.4" rx="2.6"/><path d="M15.4 5.6V5A2 2 0 0 0 13.4 3H5A2 2 0 0 0 3 5v8.4a2 2 0 0 0 2 2h.6"/>',
  ok:'<path d="m4.8 12.4 4.8 4.8L19.2 7.6"/>',
  next:'<path d="m9.6 5.6 6.4 6.4-6.4 6.4"/>',
  back:'<path d="M14.4 5.6 8 12l6.4 6.4"/>',
  time:'<circle cx="12" cy="12.6" r="8.2"/><path d="M12 8.4v4.4l2.6 1.9M9.6 2.6h4.8"/>',
};
const ic=(n,s,w)=>`<svg viewBox="0 0 24 24" width="${s||20}" height="${s||20}" fill="none" stroke="currentColor" stroke-width="${w||1.7}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* four types. that's it. no jargon buckets. */
const TYPES=[['txt','Text','14 saved'],['img','Images','2 saved'],['doc','Docs','3 saved'],['lnk','Links','3 saved']];
const ITEMS=[
  ['alex.rivera@example.com','txt','Email','yesterday',1,0],
  ['Best,\nAlex Rivera','txt','Signature','3d ago',1,0],
  ['PineTree-Guest / autumn2026!','txt','Wifi','2h ago',0,1],
  ['+1 (614) 555-0164','txt','Phone','last week',0,1],
  ['DE89 3704 0044 0532 0130 00','txt','IBAN','last week',0,1],
  ['482 Maple Grove Ave, Apt 3B, Columbus OH 43210','txt','Address','2w ago',0,0],
];
let PLAT='md',THEME='light';
const dark=()=>THEME==='dark';

function card(it){
  const [val,c,tag,when,pin,code]=it;
  const tagStyle=dark()?`color:var(--c-${c})`:`background:var(--t-${c});color:var(--c-${c})`;
  return `<div class="card" data-c="${c}">
    ${pin?`<span class="pin" style="${dark()?`color:var(--c-${c})`:`background:var(--t-${c});color:var(--c-${c})`}">${ic('pin',13,2)}</span>`:''}
    <div class="in"><div class="val${code?' code':''}">${val.replace(/\n/g,'<br>')}</div>
      <div class="meta"><span class="tagl" style="${tagStyle}">${tag}</span>
      <span class="when">${when}</span></div></div></div>`;
}
const nav=on=>`<div class="nav">${[['txt','Vault'],['find','Find'],['cog','You']]
  .map((n,i)=>`<div class="n" data-on="${i===on?1:0}"><span class="pill">${ic(n[0],21)}</span>${n[1]}</div>`).join('')}</div>`;
const sbar=()=>`<div class="sbar"><span>9:41</span><span>5G</span></div>`;
/* manual add now lives here — a quiet toolbar button, not a floating billboard */
const tbar=(left,title)=>`<div class="tbar">
  <span class="tbtn">${ic(left,17)}</span>
  ${title?`<span style="font-weight:600;font-size:15px">${title}</span>`:'<span></span>'}
  <span class="tbtn">${ic('add',17)}</span></div>`;

const S={
vault:{n:'Vault',c:'No floating plus. Search is the biggest thing on screen, because finding is what you actually came to do.',
 h:()=>`${sbar()}${tbar('cog','')}<div class="roll stag" style="padding-top:46px">
   <div><h1 class="big" style="font-size:${PLAT==='ios'?33:34}px;padding:6px 20px 0">Everything<br>you reuse</h1>
     <div class="sub">22 things · 2 pinned</div></div>
   <div class="hunt">${ic('find',20)} Search everything</div>
   <div class="sect">Pinned</div>
   ${ITEMS.filter(i=>i[4]).map(card).join('')}
   <div class="sect">By type</div>
   <div class="tiles">
     ${TYPES.map(t=>`<div class="tile" style="${dark()?`color:var(--c-${t[0]})`:`background:var(--t-${t[0]});color:var(--c-${t[0]})`}">
       <span class="glyph" style="${dark()?'':`background:color-mix(in srgb,var(--c-${t[0]}) 16%,transparent)`}">${ic(t[0],19)}</span>
       <span class="n">${t[1]}</span><span class="c">${t[2]}</span></div>`).join('')}
   </div>
 </div>${nav(0)}`},

type:{n:'Text',c:'One type, one list, newest first. Pinned things float to the top — that is what "keeping" something means. No second bucket to learn.',
 h:()=>`${sbar()}${tbar('back','Text')}<div class="roll stag" style="padding-top:46px">
   <div><h1 class="big" style="font-size:33px;padding:6px 20px 0;color:var(--c-txt)">Text</h1>
     <div class="sub">14 things · 2 pinned</div></div>
   <div class="hunt">${ic('find',20)} Search text</div>
   <div class="sect">Pinned</div>
   ${ITEMS.filter(i=>i[4]).map(card).join('')}
   <div class="sect">Everything else</div>
   ${ITEMS.filter(i=>!i[4]).map(card).join('')}
 </div>${nav(0)}`},

item:{n:'Item',c:'One weighted action in the type colour. Sensitive things state the consequence in words, not a lock icon.',
 h:()=>`${sbar()}<div class="roll" style="opacity:.35">
   <div><h1 class="big" style="font-size:33px;padding:6px 20px 0;color:var(--c-txt)">Text</h1></div>

};

const ORDER=['vault','type','item','reach','you'];
let cur='vault';
function render(){
  document.body.className=(PLAT==='ios'?'ios':'md')+(dark()?' dark':'');
  document.getElementById('scr').innerHTML=S[cur].h();
  document.getElementById('cap').textContent=S[cur].c;
  document.getElementById('platSeg').innerHTML=[['md','Android'],['ios','iOS']]
    .map(p=>`<button data-p="${p[0]}" data-on="${PLAT===p[0]?1:0}">${p[1]}</button>`).join('');
  document.getElementById('themeSeg').innerHTML=[['light','Light'],['dark','Dark']]
    .map(t=>`<button data-t="${t[0]}" data-on="${THEME===t[0]?1:0}">${t[1]}</button>`).join('');
  [...document.getElementById('platSeg').children].forEach(b=>b.onclick=()=>{PLAT=b.dataset.p;render()});
  [...document.getElementById('themeSeg').children].forEach(b=>b.onclick=()=>{THEME=b.dataset.t;render()});
  [...document.getElementById('rail').children].forEach(b=>b.dataset.on=b.dataset.k===cur?'1':'0');
  document.getElementById('notes').innerHTML=`
    <h3>Why the plus went</h3>
    <p>It did the rarest thing in the product — typing something in by hand — from the most prominent spot on screen. Capture happens in the <b>share sheet</b>, the <b>clipboard</b>, the <b>dial</b>. Manual entry is now a quiet toolbar button, and <b>search</b> got the weight instead.</p>
    <h3>Why "Snippets" went</h3>
    <p>Two buckets both holding text, with an invisible difference. Collections are now the four types the database already has: <b>Text, Images, Docs, Links</b>. Keeping something means <b>pinning</b> it — no jargon, no second bucket.</p>
    <h3>Dark isn't inverted</h3>
    <p>Tinted fills that read as soft paint in light turn to mud on black. So in dark the hue stops being <b>paint</b> and becomes <b>light</b>: near-black cards, a luminous edge, and the colour carried by glowing text. Same system, different physics.</p>`;
}
const rail=document.getElementById('rail');
rail.innerHTML=ORDER.map(k=>`<button data-k="${k}">${S[k].n}</button>`).join('');
[...rail.children].forEach(b=>b.onclick=()=>{cur=b.dataset.k;render()});
let sx=null;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(d)>70){const i=ORDER.indexOf(cur);cur=ORDER[(i+(d<0?1:ORDER.length-1))%ORDER.length];render()}},{passive:true});
render();
</script>
