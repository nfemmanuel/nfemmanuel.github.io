<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Instrument — the app, two native bodies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   INSTRUMENT — a precision tool for reusable data.
   Machined anodised body · engraved index ticks · vermillion
   focus mark · everything you stored rendered as data, in mono.
   The dial's lens barrel, extended to a whole app.
   ============================================================ */
:root{
  --void:#08090B;          /* outside the body */
  --body:#101317;          /* anodised housing */
  --plate:#171B20;         /* raised plate */
  --plate-hi:#1E242B;      /* machined highlight */
  --etch:#2A323B;          /* engraved line */
  --etch-lo:#1C2228;
  --ink:#E9E5DE;           /* engraved fill, warm */
  --ink-dim:#8C949E;
  --ink-faint:#5A626C;
  --mark:#FF4A2B;          /* THE index mark. one colour, used sparingly. */
  --mark-glow:#FF4A2B22;
  --brass:#C9A227;         /* secondary engraving, used almost never */
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Archivo",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;overflow-x:hidden;
  background-image:
    radial-gradient(120% 80% at 50% -10%, #161B21 0%, transparent 60%),
    repeating-linear-gradient(90deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px);
}

/* ---------- the knurl: our signature rule ---------- */
.knurl{height:9px;flex:0 0 auto;
  background:repeating-linear-gradient(90deg,var(--etch) 0 1px,transparent 1px 5px);
  opacity:.65;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.knurl.tight{background:repeating-linear-gradient(90deg,var(--etch) 0 1px,transparent 1px 3px);height:7px}

/* ---------- masthead ---------- */
header{padding:14px 16px 0;flex:0 0 auto}
.brandrow{display:flex;align-items:baseline;gap:10px}
.brand{font-size:19px;font-weight:800;letter-spacing:-.03em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--mark)}
.spec{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--ink-faint);
  text-transform:uppercase;margin-left:auto}
.tagline{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin:6px 0 0;line-height:1.5;
  max-width:52ch}

/* ---------- selector: reads like a machined switch ---------- */
.switch{display:flex;margin:12px 0 0;border:1px solid var(--etch);border-radius:2px;
  width:max-content;background:var(--plate);overflow:hidden}
.switch button{appearance:none;border:0;background:transparent;color:var(--ink-faint);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 15px;cursor:pointer;position:relative;transition:color .18s}
.switch button+button{border-left:1px solid var(--etch)}
.switch button[data-on="1"]{color:var(--ink);background:var(--plate-hi)}
.switch button[data-on="1"]::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--mark)}

.rail{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;
  border-top:1px solid var(--etch-lo);border-bottom:1px solid var(--etch-lo);margin-top:12px}
.rail::-webkit-scrollbar{display:none}
.rail button{appearance:none;border:0;background:transparent;color:var(--ink-faint);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:11px 14px;cursor:pointer;white-space:nowrap;position:relative;flex:0 0 auto;transition:color .16s}
.rail button+button{border-left:1px solid var(--etch-lo)}
.rail button[data-on="1"]{color:var(--ink)}
.rail button[data-on="1"]::before{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;
  background:var(--mark);animation:slidein .28s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}

.caption{font-family:var(--mono);font-size:10.5px;line-height:1.65;color:var(--ink-dim);
  padding:10px 16px;flex:0 0 auto;display:flex;gap:9px;align-items:flex-start}
.caption .idx{width:3px;flex:0 0 auto;align-self:stretch;background:var(--mark);margin-top:2px;margin-bottom:2px}

/* ---------- the device ---------- */
.stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;padding:0 12px 14px}
.device{position:relative;width:100%;max-width:392px;height:min(70vh,100%);min-height:0;
  border-radius:14px;overflow:hidden;background:var(--body);
  border:1px solid var(--etch);
  box-shadow:0 0 0 1px #000 inset, 0 22px 50px rgba(0,0,0,.6);}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--body)}

@media (min-width:900px){
  body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:0 34px;
    padding:30px;height:auto;min-height:100%}
  header,.rail{flex-basis:100%;max-width:880px;padding-inline:0}
  .caption{display:none}
  .stage{flex:0 0 auto;height:auto;padding:22px 0 0}
  .device{width:378px;height:756px;border-radius:34px;border-width:8px;border-color:#0A0C0E}
  .notes{display:block;flex:0 0 300px;max-width:330px;padding-top:22px}
}
.notes{display:none;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--ink-dim)}
.notes h3{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 8px;font-weight:700}
.notes p{margin:0 0 14px}
.notes b{color:var(--ink);font-weight:500}
.notes .sep{height:1px;background:repeating-linear-gradient(90deg,var(--etch) 0 1px,transparent 1px 5px);margin:16px 0}

/* ============ screen internals ============ */
.status{height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);letter-spacing:.08em}
.scroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.head{padding:14px 18px 10px}
.head h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1}
.head .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:7px}

/* engraved section label with tick */
.lbl{display:flex;align-items:center;gap:9px;padding:16px 18px 8px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint)}
.lbl::after{content:"";flex:1;height:1px;
  background:repeating-linear-gradient(90deg,var(--etch) 0 1px,transparent 1px 4px)}

/* the slot: where a stored thing lives */
.slot{display:flex;gap:0;margin:0 14px 7px;background:var(--plate);border:1px solid var(--etch-lo);
  border-radius:3px;overflow:hidden;cursor:pointer;position:relative;
  transition:border-color .16s,transform .16s}
.slot:active{transform:scale(.994)}
.slot .mark{width:3px;flex:0 0 auto;background:transparent}
.slot[data-pin="1"] .mark{background:var(--mark)}
.slot[data-pin="1"]{border-color:#3A2A26}
.slot .in{flex:1;min-width:0;padding:11px 13px}
.slot .val{font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--ink);
  word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot .foot{display:flex;align-items:center;gap:7px;margin-top:8px;
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.slot .foot .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint)}
.slot .side{flex:0 0 auto;display:flex;align-items:center;padding:0 12px;color:var(--ink-faint)}
.slot .thumb{height:52px;border-radius:2px;margin:11px 13px;flex:1}

/* directory rows (collections) */
.dir{display:flex;align-items:center;gap:13px;padding:12px 18px;cursor:pointer;
  border-bottom:1px solid var(--etch-lo)}
.dir:active{background:var(--plate)}
.dir .g{width:30px;height:30px;border:1px solid var(--etch);border-radius:2px;display:flex;
  align-items:center;justify-content:center;color:var(--ink-dim);flex:0 0 auto;background:var(--plate)}
.dir .n{flex:1;min-width:0}
.dir .n b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.dir .n span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);display:block;margin-top:3px}
.dir .ct{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}

/* seek bar */
.seek{margin:0 14px 4px;display:flex;align-items:center;gap:10px;padding:10px 13px;
  background:var(--plate);border:1px solid var(--etch-lo);border-radius:3px;
  font-family:var(--mono);font-size:11px;color:var(--ink-faint);letter-spacing:.06em}

/* bottom control deck */
.deck{flex:0 0 auto;border-top:1px solid var(--etch);background:var(--plate);
  display:flex;padding:9px 0 calc(11px + env(safe-area-inset-bottom))}
.deck .k{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-faint);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  position:relative}
.deck .k[data-on="1"]{color:var(--ink)}
.deck .k[data-on="1"]::before{content:"";position:absolute;top:-9px;width:26px;height:2px;background:var(--mark)}
/* iOS body swaps the deck to a lighter, tighter rhythm */
.ios .deck{padding:7px 0 calc(9px + env(safe-area-inset-bottom))}
.ios .deck .k[data-on="1"]::before{width:100%;left:0;right:0;height:1px;background:var(--etch);top:-7px}
.ios .deck .k[data-on="1"]{color:var(--mark)}

/* capture button — machined shutter */
.shutter{position:absolute;right:16px;bottom:82px;width:54px;height:54px;cursor:pointer;
  background:radial-gradient(circle at 38% 32%,var(--plate-hi),var(--body));
  border:1px solid var(--etch);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.55), 0 0 0 4px #0C0E11}
.android .shutter{border-radius:16px}
.ios .shutter{border-radius:50%}
.shutter::after{content:"";position:absolute;inset:5px;border:1px solid var(--etch-lo);border-radius:inherit}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--plate);z-index:6;
  border-top:1px solid var(--etch);padding:0 0 20px;
  box-shadow:0 -18px 40px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
.android .sheet{border-radius:16px 16px 0 0}
.ios .sheet{border-radius:10px 10px 0 0}
.sheet .pull{width:30px;height:3px;background:var(--etch);border-radius:2px;margin:9px auto 0}

.act{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 14px;padding:13px;
  background:var(--mark);color:#120603;border-radius:3px;font-weight:700;font-size:14px;
  letter-spacing:.02em;cursor:pointer;font-family:var(--sans)}
.act.sec{background:transparent;color:var(--ink);border:1px solid var(--etch)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--etch-lo);
  font-size:13.5px;cursor:pointer}
.opt .g{color:var(--ink-dim);flex:0 0 auto;display:flex}
.opt .t{flex:1}
.opt .v{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}

.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:3px 7px;border:1px solid var(--etch);color:var(--ink-dim);border-radius:2px}
.tag.hot{border-color:var(--mark);color:var(--mark)}

.gauge{margin:0 14px 8px;padding:12px 13px;background:var(--plate);border:1px solid var(--etch-lo);border-radius:3px}
.gauge .top{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.gauge .num{font-family:var(--mono);font-size:19px;color:var(--ink);letter-spacing:-.02em}
.gauge .num i{font-style:normal;color:var(--ink-faint);font-size:12px}
.gauge .bar{height:3px;background:var(--etch-lo);margin-top:9px;position:relative;overflow:hidden}
.gauge .bar i{position:absolute;inset:0 auto 0 0;background:var(--mark);animation:fill .6s cubic-bezier(.2,.9,.3,1)}
@keyframes fill{from{width:0!important}}

.stagger>*{animation:up .34s both cubic-bezier(.2,.9,.3,1)}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.05s}
.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.11s}
.stagger>*:nth-child(5){animation-delay:.14s}.stagger>*:nth-child(6){animation-delay:.17s}
.stagger>*:nth-child(7){animation-delay:.2s}.stagger>*:nth-child(8){animation-delay:.23s}
.stagger>*:nth-child(n+9){animation-delay:.26s}
@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
svg{display:block}
button:focus-visible{outline:1px solid var(--mark);outline-offset:2px}
</style>
</head>
<body class="android">

<header>
  <div class="brandrow">
    <div class="brand">Reel<em>.</em></div>
    <div class="spec" id="spec">Android · One UI</div>
  </div>
  <p class="tagline">A precision instrument for the things you retype. Machined body, engraved labels, everything you stored shown as what it is — data.</p>
  <div class="switch" id="switch"></div>
</header>

<nav class="rail" id="rail"></nav>
<div class="caption" id="caption"></div>

<div class="stage"><div class="device"><div class="scr" id="scr"></div></div></div>

<aside class="notes" id="notes"></aside>

<script>
'use strict';
/* ---- icons: geometric line work, drawn to match the engraving ---- */
const I={
  clip:'<rect x="5.5" y="3.5" width="13" height="17" rx="1.5"/><path d="M9 3.5V2.8h6v.7M9 9h6M9 12.5h6M9 16h3.5"/>',
  snip:'<circle cx="6" cy="6.5" r="2.4"/><circle cx="6" cy="17.5" r="2.4"/><path d="M8.1 8.1 19 19M19 5 8.1 15.9"/>',
  doc:'<path d="M6 2.8h7.5L18 7.3v13.9H6z"/><path d="M13.3 2.8v4.6H18M9 12h6M9 15.5h6"/>',
  img:'<rect x="3.5" y="5" width="17" height="14" rx="1.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m4 17 4.6-4.6 3 3 3.4-3.4L20 17"/>',
  link:'<path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 0 0 5.7 5.7l1.2-1.2"/>',
  pin:'<path d="M9 3h6v5.5l2.5 3.5v2H6.5v-2L9 8.5z"/><path d="M12 14v7"/>',
  seek:'<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4.5 4.5"/>',
  add:'<path d="M12 5.5v13M5.5 12h13"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/>',
  key:'<rect x="2.5" y="6" width="19" height="12" rx="1.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.5h.01M9.5 13.5h.01M13 13.5h.01M16.5 13.5h.01M8.5 16.5h7"/>',
  layer:'<path d="m12 3 8.5 4.5L12 12 3.5 7.5z"/><path d="m4.5 11 -1 .5L12 16l8.5-4.5-1-.5"/><path d="m4.5 15 -1 .5L12 20l8.5-4.5-1-.5"/>',
  share:'<path d="M12 15.5V3.5"/><path d="m8.5 6.8 3.5-3.3 3.5 3.3"/><path d="M7 10.5H5v10h14v-10h-2"/>',
  copy:'<rect x="8.5" y="8.5" width="12" height="12.5" rx="1.5"/><path d="M15.5 5.5V3.5h-12v12h2"/>',
  ok:'<path d="m4.5 12.5 5 5 10-11"/>',
  next:'<path d="m9.5 5.5 6.5 6.5-6.5 6.5"/>',
  back:'<path d="M14.5 5.5 8 12l6.5 6.5"/>',
  time:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.8M9.5 2.5h5"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8.5 10.5V7a3.5 3.5 0 0 1 7 0v3.5"/>',
};
let PLAT='android';
const ic=(n,s)=>`<svg viewBox="0 0 24 24" width="${s||18}" height="${s||18}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

const DIRS=[
  ['clip','Clipboard','inbox · raw capture','6'],
  ['snip','Snippets','curated · reused','7'],
  ['doc','Docs','pdf · attachments','3'],
  ['img','Images','photo · screenshot','2'],
  ['link','Links','url · scheduling','3'],
];
const SLOTS=[
  ['PineTree-Guest / autumn2026!','WIFI','copy',0],
  ['alex.rivera@example.com','EMAIL','copy',1],
  ['+1 (614) 555-0164','PHONE','copy',0],
  ['482 Maple Grove Ave, Apt 3B\nColumbus OH 43210','ADDRESS','copy',0],
  ['DE89 3704 0044 0532 0130 00','IBAN · SENSITIVE','lock',0],
];
const st=()=>`<div class="status"><span>09:41</span><span>${PLAT==='ios'?'5G':'5G ▮▮'}</span></div>`;
const deck=on=>`<div class="deck">${[['clip','Vault'],['seek','Seek'],['gear','Setup']]
  .map((k,i)=>`<div class="k" data-on="${i===on?1:0}">${ic(k[0],19)}${k[1]}</div>`).join('')}</div>`;

const S={
vault:{n:'Vault',c:'Home. Pinned slots carry the index mark. Everything stored is shown as data — mono, unstyled, exactly as you saved it.',
 h:()=>`${st()}<div class="scroll stagger">
  <div class="head"><h1>Vault</h1><div class="sub">21 items · 2 pinned</div></div>
  <div class="seek">${ic('seek',15)} SEEK ANYTHING</div>
  <div class="lbl">Pinned</div>
  ${SLOTS.filter(s=>s[3]).map(s=>slot(s)).join('')}
  ${slot(['Best,\nAlex Rivera','SIGNATURE','copy',1])}
  <div class="lbl">Directory</div>
  ${DIRS.map(d=>`<div class="dir"><span class="g">${ic(d[0],16)}</span>
    <span class="n"><b>${d[1]}</b><span>${d[2]}</span></span>
    <span class="ct">${d[3]}</span>${ic('next',15)}</div>`).join('')}
  <div style="height:92px"></div></div>
  <div class="shutter">${ic('add',22)}</div>${deck(0)}`},

dir:{n:'Directory',c:'Inside a collection. No icons on items — the content is the identity. Type lives in the engraved footer line, not a badge.',
 h:()=>`${st()}<div class="scroll stagger">
  <div class="head" style="padding-top:8px">
    <div style="display:flex;align-items:center;gap:8px;color:var(--ink-faint);font-family:var(--mono);
      font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px">${ic('back',14)} VAULT</div>
    <h1>Clipboard</h1><div class="sub">inbox · 6 items · promote to keep</div></div>
  <div class="seek">${ic('seek',15)} SEEK IN CLIPBOARD</div>
  <div class="lbl">Most recent</div>
  ${SLOTS.map(s=>slot(s)).join('')}
  <div class="slot"><span class="mark"></span>
    <span class="thumb" style="background:linear-gradient(118deg,#2A3A47,#151C22)"></span></div>
  <div style="height:92px"></div></div>
  <div class="shutter">${ic('add',22)}</div>${deck(0)}`},

item:{n:'Item',c:'One action, weighted. Sensitive items state the clipboard consequence in plain language — no lock icon theatre.',
 h:()=>`${st()}<div class="scroll" style="filter:brightness(.45)">
  <div class="head"><h1>Clipboard</h1></div>${SLOTS.slice(0,3).map(s=>slot(s)).join('')}</div>
  <div class="sheet"><div class="pull"></div>
   <div style="padding:14px 18px 12px">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:11px">
      <span class="tag hot">Sensitive</span><span class="tag">Clipboard</span>
      <span style="margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
        color:var(--ink-faint)">USED 4×</span></div>
    <div style="font-family:var(--mono);font-size:15px;line-height:1.6;letter-spacing:.02em;
      padding:13px;background:var(--body);border:1px solid var(--etch-lo);border-radius:2px">DE89 3704 0044<br>0532 0130 00</div>
   </div>
   <div style="padding:0 0 4px"><div class="act">${ic('copy',18)} COPY</div></div>
   <div style="display:flex;gap:8px;align-items:center;padding:11px 18px;font-family:var(--mono);
     font-size:10px;color:var(--ink-faint);letter-spacing:.06em">${ic('time',14)} CLEARS FROM CLIPBOARD IN 60S</div>
   <div class="opt"><span class="g">${ic('pin',17)}</span><span class="t">Pin to a slot</span><span class="v">Slot 3</span></div>
   <div class="opt"><span class="g">${ic('share',17)}</span><span class="t">Send elsewhere</span>${ic('next',14)}</div>
   <div class="opt"><span class="g">${ic('snip',17)}</span><span class="t">Promote to Snippets</span>${ic('next',14)}</div>
  </div>`},

reach:{n:'Reach',c:'The distinctive screen: how you get at your stuff without opening this. Three already live, exactly one asked of you, the rest optional.',
 h:()=>`${st()}<div class="scroll stagger">
  <div class="head"><h1>Reach</h1><div class="sub">ways in, without opening this</div></div>
  <div class="lbl">Live</div>
  ${[['share','Share sheet','save from anywhere'],
     [PLAT==='ios'?'seek':'layer',PLAT==='ios'?'Spotlight':'Quick tile',PLAT==='ios'?'search from home':'one swipe, any screen'],
     ['doc','Files','attach without leaving mail']]
    .map(r=>`<div class="dir"><span class="g">${ic(r[0],16)}</span>
      <span class="n"><b>${r[1]}</b><span>${r[2]}</span></span>
      <span style="color:var(--mark)">${ic('ok',16)}</span></div>`).join('')}
  <div class="lbl">Set one up</div>
  <div class="slot" data-pin="1"><span class="mark"></span><div class="in">
    <div style="font-size:15px;font-weight:600;margin-bottom:5px">${PLAT==='ios'?'Back Tap':'Edge dial'}</div>
    <div style="font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);line-height:1.6">
      ${PLAT==='ios'?'Double-tap the back of the phone.<br>Two taps, item on the clipboard.':'Swipe in from the edge.<br>Turn, release, inserted.'}</div>
    <div class="foot"><span>~40 SEC SETUP</span><span class="dot"></span><span>ONE TIME</span></div>
  </div><span class="side">${ic('next',16)}</span></div>
  <div class="lbl">Optional</div>
  ${[['key','Vault keyboard','type without switching apps'],
     ['pin',PLAT==='ios'?'Widgets · Action Button':'Widgets · shortcuts','pinned slots, one press']]
    .map(r=>`<div class="dir"><span class="g">${ic(r[0],16)}</span>
      <span class="n"><b>${r[1]}</b><span>${r[2]}</span></span>${ic('next',15)}</div>`).join('')}
  <div style="height:92px"></div></div>${deck(2)}`},

take:{n:'Take',c:'Capture. Type is read from what you wrote, never asked. The blank is detected and marked in the index colour.',
 h:()=>`${st()}<div class="scroll stagger">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:13px 18px;
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase">
    <span style="color:var(--ink-faint)">Discard</span><span style="color:var(--ink)">New</span>
    <span style="color:var(--mark)">Keep</span></div>
  <div style="margin:4px 14px 0;padding:15px;background:var(--plate);border:1px solid var(--etch-lo);
    border-radius:3px;min-height:132px;font-family:var(--mono);font-size:13px;line-height:1.7">Thanks for the great conversation, <span style="color:var(--mark);border-bottom:1.5px solid var(--mark);padding-bottom:1px">____</span> — I left even more excited about the role.</div>
  <div class="lbl">Read from what you wrote</div>
  <div class="dir"><span class="g">${ic('snip',16)}</span>
    <span class="n"><b>Text with a blank</b><span>you fill it each time</span></span>
    <span style="color:var(--mark)">${ic('ok',16)}</span></div>
  <div class="dir"><span class="g">${ic('doc',16)}</span>
    <span class="n"><b>Filed to Snippets</b><span>change if you like</span></span>${ic('next',15)}</div>
  <div class="lbl">Handling</div>
  <div class="dir"><span class="g">${ic('lock',16)}</span>
    <span class="n"><b>Sensitive</b><span>hide preview · clear after use</span></span>
    <span style="width:38px;height:21px;border:1px solid var(--etch);border-radius:2px;position:relative;background:var(--body)">
    <span style="position:absolute;top:2px;left:2px;width:15px;height:15px;background:var(--etch)"></span></span></div>
 </div>`},

setup:{n:'Setup',c:'Limits shown as gauges, never hidden. You always know how much room is left before anything asks for money.',
 h:()=>`${st()}<div class="scroll stagger">
  <div class="head"><h1>Setup</h1><div class="sub">free tier · everything on device</div></div>
  <div class="lbl">Capacity</div>
  <div class="gauge"><div class="top"><span>Pinned slots</span><span>${ic('pin',13)}</span></div>
    <div class="num">2<i>/2</i></div><div class="bar"><i style="width:100%"></i></div></div>
  <div class="gauge"><div class="top"><span>Files &amp; images</span><span>${ic('img',13)}</span></div>
    <div class="num">5<i>/20</i></div><div class="bar"><i style="width:25%"></i></div></div>
  <div style="padding:6px 0 2px"><div class="act">REMOVE THE LIMITS</div></div>
  <div style="font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);text-align:center;
    padding:9px 18px 0;letter-spacing:.1em">ONE PAYMENT · NO SUBSCRIPTION</div>
  <div class="lbl">Body</div>
  <div class="dir"><span class="g">${ic('layer',16)}</span>
    <span class="n"><b>Dial position</b><span>right edge · locked</span></span>${ic('next',15)}</div>
  <div class="dir"><span class="g">${ic('gear',16)}</span>
    <span class="n"><b>Finish</b><span>graphite</span></span>${ic('next',15)}</div>
  <div class="lbl">Privacy</div>
  <div style="margin:0 14px;padding:13px;background:var(--plate);border:1px solid var(--etch-lo);
    border-radius:3px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--ink-dim)">
    NO ACCOUNT. NO SERVER. NO ANALYTICS.<br>
    <span style="color:var(--ink)">Everything lives on this ${PLAT==='ios'?'iPhone':'phone'}.</span></div>
  <div style="height:92px"></div></div>${deck(2)}`},
};
function slot(s){
  return `<div class="slot" data-pin="${s[3]}"><span class="mark"></span>
    <div class="in"><div class="val">${s[0].replace(/\n/g,'<br>')}</div>
      <div class="foot"><span>${s[1]}</span><span class="dot"></span><span>${s[3]?'PINNED':'RECENT'}</span></div></div>
    <span class="side">${ic(s[2],16)}</span></div>`;
}

const ORDER=['vault','dir','item','reach','take','setup'];
let cur='vault';
function render(){
  document.body.className=PLAT;
  document.getElementById('spec').textContent=PLAT==='ios'?'iOS · Apple HIG':'Android · One UI';
  document.getElementById('scr').innerHTML=S[cur].h();
  document.getElementById('caption').innerHTML=`<span class="idx"></span><span>${S[cur].c}</span>`;
  document.getElementById('switch').innerHTML=[['android','Android'],['ios','iOS']]
    .map(p=>`<button data-p="${p[0]}" data-on="${PLAT===p[0]?1:0}">${p[1]}</button>`).join('');
  [...document.getElementById('switch').children].forEach(b=>b.onclick=()=>{PLAT=b.dataset.p;render()});
  [...document.getElementById('rail').children].forEach(b=>b.dataset.on=b.dataset.k===cur?'1':'0');
  document.querySelector(`#rail [data-k="${cur}"]`)?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  document.getElementById('notes').innerHTML=`
    <h3>The idea</h3>
    <p>What people store here is <b>data</b> — an IBAN, a wifi key, an order number. So it is set in mono and shown raw. No card decoration competing with the thing you came for.</p>
    <div class="sep"></div>
    <h3>Where it comes from</h3>
    <p>The dial is a machined lens barrel. This is the rest of that instrument: <b>knurled rules</b>, engraved uppercase labels, hairline plate edges, and exactly one colour — the <b style="color:var(--mark)">focus index</b>, spent only on pinned slots and the single action that matters.</p>
    <div class="sep"></div>
    <h3>Two bodies</h3>
    <p><b>Android</b> squares its shutter, keeps a hard indicator bar, denser deck. <b>iOS</b> rounds the shutter, uses a hairline rule and tints the active key. Same instrument, different housing — the identity does not soften on either.</p>`;
}
const rail=document.getElementById('rail');
rail.innerHTML=ORDER.map(k=>`<button data-k="${k}">${S[k].n}</button>`).join('');
[...rail.children].forEach(b=>b.onclick=()=>{cur=b.dataset.k;render()});
let sx=null;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(d)>70){const i=ORDER.indexOf(cur);cur=ORDER[(i+(d<0?1:ORDER.length-1))%ORDER.length];render()}},{passive:true});
render();
</script>
</body>
</html>
