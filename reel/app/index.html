<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The main app — Android and iOS</title>
<style>
  :root{
    --page:#F3F1EC; --card:#FFF; --ink:#1C2025; --dim:#68707A; --line:#E3DFD5;
    --brand:#0E8C7F; --brand-soft:#0E8C7F1A;
    --shadow:0 8px 24px rgba(24,28,34,.10);
  }
  @media (prefers-color-scheme:dark){:root{
    --page:#0E1115; --card:#161B21; --ink:#E8ECF1; --dim:#8B95A1; --line:#232A32;
    --brand:#2FB9A9; --brand-soft:#2FB9A924; --shadow:0 8px 24px rgba(0,0,0,.5);
  }}
  :root[data-theme=dark]{--page:#0E1115;--card:#161B21;--ink:#E8ECF1;--dim:#8B95A1;--line:#232A32;
    --brand:#2FB9A9;--brand-soft:#2FB9A924;--shadow:0 8px 24px rgba(0,0,0,.5);}
  :root[data-theme=light]{--page:#F3F1EC;--card:#FFF;--ink:#1C2025;--dim:#68707A;--line:#E3DFD5;
    --brand:#0E8C7F;--brand-soft:#0E8C7F1A;--shadow:0 8px 24px rgba(24,28,34,.10);}

  /* platform surface tokens — swapped wholesale by the toggle */
  .plat-android{
    --s-bg:#F7F2FA; --s-card:#FFF; --s-txt:#1C1B1F; --s-dim:#49454F; --s-line:#E7E0EC;
    --s-accent:#4F6354; --s-accent-c:#FFF; --s-tonal:#DCE5DC; --s-r-card:20px; --s-r-btn:100px;
    --s-font:"Roboto",system-ui,sans-serif;
  }
  .plat-ios{
    --s-bg:#F2F2F7; --s-card:#FFF; --s-txt:#000; --s-dim:#8A8A8E; --s-line:#E5E5EA;
    --s-accent:#007AFF; --s-accent-c:#FFF; --s-tonal:#EAF3FF; --s-r-card:12px; --s-r-btn:12px;
    --s-font:-apple-system,"SF Pro Text",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    .plat-android{--s-bg:#141218;--s-card:#211F26;--s-txt:#E6E0E9;--s-dim:#CAC4D0;--s-line:#49454F;
      --s-accent:#B5CCBA;--s-accent-c:#21372B;--s-tonal:#37493C;}
    .plat-ios{--s-bg:#000;--s-card:#1C1C1E;--s-txt:#FFF;--s-dim:#98989F;--s-line:#38383A;
      --s-accent:#0A84FF;--s-tonal:#0A2540;}
  }
  :root[data-theme=dark] .plat-android{--s-bg:#141218;--s-card:#211F26;--s-txt:#E6E0E9;--s-dim:#CAC4D0;
    --s-line:#49454F;--s-accent:#B5CCBA;--s-accent-c:#21372B;--s-tonal:#37493C;}
  :root[data-theme=dark] .plat-ios{--s-bg:#000;--s-card:#1C1C1E;--s-txt:#FFF;--s-dim:#98989F;
    --s-line:#38383A;--s-accent:#0A84FF;--s-tonal:#0A2540;}

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);display:flex;flex-direction:column;
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

  .top{padding:10px 14px 0;flex:0 0 auto}
  .top h1{font-size:15px;margin:0 0 2px;letter-spacing:-.01em}
  .top p{margin:0;font-size:12px;color:var(--dim);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  @media (min-width:880px){.top p{-webkit-line-clamp:unset;display:block}}
  .toggle{display:flex;gap:0;margin:10px 0 0;background:var(--card);border:1px solid var(--line);
    border-radius:99px;padding:3px;width:max-content}
  .toggle button{border:none;background:none;color:var(--dim);font:inherit;font-size:12.5px;
    padding:6px 16px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .toggle button[data-on="1"]{background:var(--brand);color:#fff}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;flex:0 0 auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--dim);
    border-radius:99px;padding:7px 13px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip[data-on="1"]{border-color:var(--brand);background:var(--brand-soft);color:var(--ink)}
  .nav{display:flex;gap:8px;align-items:center;padding:0 14px 8px;flex:0 0 auto}
  .nav button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;
    padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
  .meta{flex:1;font-size:12px;color:var(--dim);line-height:1.35}

  .stage{flex:1 1 auto;min-height:0;padding:0 10px calc(10px + env(safe-area-inset-bottom));
    display:flex;justify-content:center}
  /* min(...,100%) so the frame can never exceed the stage and push its own nav bar
     below the fold — measured, not guessed: frame was 585px inside a 565px stage. */
  .frame{position:relative;width:100%;max-width:400px;height:min(72vh,100%);min-height:0;
    border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
  .scr{position:absolute;inset:0;background:var(--s-bg);color:var(--s-txt);font-family:var(--s-font);
    display:flex;flex-direction:column}

  @media (min-width:880px){
    body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:24px;
      padding:24px;height:auto;min-height:100%}
    .top,.chips{flex-basis:100%;max-width:840px;padding-inline:0}
    .nav{display:none}
    .stage{flex:0 0 auto;padding:0;height:auto}
    .frame{width:360px;height:720px;border:10px solid #101317;border-radius:44px}
    .side{display:block;flex:0 0 300px;max-width:340px}
    .side .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;
      margin-bottom:12px;font-size:13px;color:var(--dim);box-shadow:var(--shadow)}
    .side b{color:var(--ink)}
    .side h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  }
  .side{display:none}

  /* ---- shared screen furniture, themed by platform vars ---- */
  .sb{height:42px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 20px 4px;font-size:12.5px;font-weight:600;opacity:.85}
  .body{flex:1;overflow-y:auto;min-height:0}
  .ttl{padding:6px 16px 10px;font-weight:700;letter-spacing:-.02em}
  .plat-android .ttl{font-size:26px}
  .plat-ios .ttl{font-size:31px;letter-spacing:-.028em}
  .search{margin:0 14px 12px;height:38px;border-radius:99px;background:var(--s-line);display:flex;
    align-items:center;gap:8px;padding:0 13px;color:var(--s-dim);font-size:14.5px}
  .plat-ios .search{border-radius:10px;height:36px}
  .sec{font-size:11.5px;font-weight:600;color:var(--s-dim);letter-spacing:.05em;text-transform:uppercase;
    padding:12px 18px 6px}
  .grp{background:var(--s-card);margin:0 12px;border-radius:var(--s-r-card);overflow:hidden}
  .plat-android .grp{background:transparent;display:flex;flex-direction:column;gap:8px;margin:0 12px}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:15px;cursor:pointer}
  .plat-ios .row{border-bottom:.5px solid var(--s-line)}
  .plat-ios .row:last-child{border-bottom:none}
  .plat-android .row{background:var(--s-card);border-radius:16px}
  .row .ic{width:38px;height:38px;border-radius:11px;background:var(--s-tonal);display:flex;
    align-items:center;justify-content:center;flex:0 0 auto}
  .plat-ios .row .ic{width:29px;height:29px;border-radius:7px;background:transparent}
  .row .tx{flex:1;min-width:0}
  .row .tx .sub{font-size:12.5px;color:var(--s-dim);margin-top:1px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .row .cnt{color:var(--s-dim);font-size:14px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 12px}
  .cd{background:var(--s-card);border-radius:var(--s-r-card);padding:11px 12px;min-height:74px;
    display:flex;flex-direction:column;gap:5px;font-size:12.5px;line-height:1.4;cursor:pointer;
    border:1px solid transparent;overflow:hidden}
  .plat-ios .cd{border-color:var(--s-line)}
  .cd .pv{color:var(--s-txt);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word}
  .cd .ft{display:flex;align-items:center;gap:5px;color:var(--s-dim);font-size:10.5px;margin-top:auto}
  .cd .thumb{flex:1;min-height:44px;border-radius:8px}
  .bar{flex:0 0 auto;background:var(--s-card);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  .plat-ios .bar{border-top:.5px solid var(--s-line)}
  .plat-android .bar{background:var(--s-card);border-top:1px solid var(--s-line)}
  .bar .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--s-dim)}
  .bar .t[data-on="1"]{color:var(--s-accent)}
  .plat-android .bar .t[data-on="1"] .pill{background:var(--s-tonal)}
  .bar .t .pill{padding:3px 18px;border-radius:99px;display:flex;align-items:center;justify-content:center}
  .fab{position:absolute;right:16px;bottom:88px;background:var(--s-accent);color:var(--s-accent-c);
    display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.28);cursor:pointer}
  .plat-android .fab{width:60px;height:60px;border-radius:19px}
  .plat-ios .fab{width:52px;height:52px;border-radius:50%}
  .btn{background:var(--s-accent);color:var(--s-accent-c);border-radius:var(--s-r-btn);padding:13px;
    text-align:center;font-weight:600;font-size:15.5px;margin:0 12px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--s-accent);border:1.5px solid var(--s-accent)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s-card);z-index:5;
    border-radius:22px 22px 0 0;padding:10px 0 22px;box-shadow:0 -8px 28px rgba(0,0,0,.28)}
  .plat-ios .sheet{border-radius:14px 14px 0 0}
  .grab{width:34px;height:5px;border-radius:3px;background:var(--s-line);margin:0 auto 12px}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--s-tonal);color:var(--s-txt)}
  .stepn{width:24px;height:24px;border-radius:50%;background:var(--s-accent);color:var(--s-accent-c);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}
  .done{width:24px;height:24px;border-radius:50%;background:var(--s-tonal);display:flex;
    align-items:center;justify-content:center;flex:0 0 auto}
  svg{display:block}
  button:focus-visible,.chip:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body class="plat-android">

<div class="top">
  <h1>The main app — the thing the extensions hang off</h1>
  <p>Same data, same structure, two native skins. Toggle to see how each platform renders it. Every icon here is a real vector — Material Symbols shapes on Android, SF Symbols shapes on iOS.</p>
  <div class="toggle" id="toggle"></div>
</div>

<div class="chips" id="chips"></div>

<div class="nav">
  <button id="prev">Prev</button>
  <div class="meta" id="meta"></div>
  <button id="next">Next</button>
</div>

<div class="stage"><div class="frame"><div class="scr" id="scr"></div></div></div>

<aside class="side" id="side"></aside>

const ORDER=['library','collection','item','surfaces','capture','settings'];
let cur='library';

function render(){
  document.body.className='plat-'+PLAT;
  const s=SCREENS[cur];
  document.getElementById('scr').innerHTML=s.html();
  document.getElementById('meta').textContent=s.cap;
  document.getElementById('toggle').innerHTML=
    [['android','Android'],['ios','iOS']].map(p=>
      `<button data-p="${p[0]}" data-on="${PLAT===p[0]?1:0}">${p[1]}</button>`).join('');
  [...document.getElementById('toggle').children].forEach(b=>b.onclick=()=>{PLAT=b.dataset.p;render();});
  [...document.getElementById('chips').children].forEach(c=>c.dataset.on=c.dataset.k===cur?'1':'0');
  document.querySelector(`.chip[data-k="${cur}"]`)?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  document.getElementById('side').innerHTML=`<div class="card"><h2>What differs</h2>
    <b>Android</b> uses Material 3: rounded 20px cards on a tonal surface, a squircle FAB, pill-shaped
    nav indicators, and Material Symbols — geometric, filled, on a 24dp grid.<br><br>
    <b>iOS</b> uses inset grouped lists on systemGroupedBackground, a circular FAB, and SF Symbols —
    lighter strokes, rounded caps, optically airier.<br><br>
    Same rows, same data, same structure. Nothing here is a compromise skin.</div>
    <div class="card"><h2>Current screen</h2>${s.cap}</div>`;
}
const chips=document.getElementById('chips');
chips.innerHTML=ORDER.map(k=>`<button class="chip" data-k="${k}">${SCREENS[k].name}</button>`).join('');
[...chips.children].forEach(el=>el.onclick=()=>{cur=el.dataset.k;render();});
document.getElementById('prev').onclick=()=>{cur=ORDER[(ORDER.indexOf(cur)+ORDER.length-1)%ORDER.length];render();};
document.getElementById('next').onclick=()=>{cur=ORDER[(ORDER.indexOf(cur)+1)%ORDER.length];render();};
let sx=null;
const scr=document.getElementById('scr');
addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>70)document.getElementById(dx<0?'next':'prev').click();},{passive:true});
render();
</script>
