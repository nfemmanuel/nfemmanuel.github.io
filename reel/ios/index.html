<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iOS screens — a guided tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ═══ product token family (app-mockup.html is canonical) ═══
     Values are copied, never invented — one palette across /reel/.
     Page accent is --c-img, the tint the hub already gives this exhibit.
     The --ios-* set below is NOT palette: it depicts Apple's own system UI
     inside the phone frame and stays exactly as Apple ships it. */
  :root{
    color-scheme:light dark;
    --ground:#F6F6F7; --surf:#FFFFFF; --ink:#14161A; --ink-2:#5C636D; --ink-3:#8B929C; --hair:#E7E8EB;
    --c-txt:#B4761C; --c-img:#7B55B4; --c-doc:#356BA6; --c-lnk:#BA5138;
    --accent:var(--c-img); --accent-soft:#7B55B422;
    --ios-bg:#F2F2F7; --ios-card:#FFFFFF; --ios-txt:#000000; --ios-dim:#8A8A8E;
    --ios-sep:#E5E5EA; --ios-blue:#007AFF;
    --shadow-s:0 1px 2px rgba(16,20,26,.05),0 4px 12px rgba(16,20,26,.05);
    --shadow-m:0 2px 6px rgba(16,20,26,.07),0 14px 34px rgba(16,20,26,.09);
    --display:"Bricolage Grotesque",system-ui,sans-serif;
    --ui:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0E1013; --surf:#181B20; --ink:#F0F1F3; --ink-2:#A2A9B3; --ink-3:#767D87; --hair:#272B31;
    --c-txt:#FFC978; --c-img:#C6A8FF; --c-doc:#8FC6FF; --c-lnk:#FFA184;
    --accent-soft:#C6A8FF26;
    --ios-bg:#000000; --ios-card:#1C1C1E; --ios-txt:#FFFFFF; --ios-dim:#98989F;
    --ios-sep:#38383A; --ios-blue:#0A84FF;
    --shadow-s:0 1px 2px rgba(0,0,0,.35); --shadow-m:0 14px 36px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#0E1013; --surf:#181B20; --ink:#F0F1F3; --ink-2:#A2A9B3; --ink-3:#767D87; --hair:#272B31;
    --c-txt:#FFC978; --c-img:#C6A8FF; --c-doc:#8FC6FF; --c-lnk:#FFA184;
    --accent-soft:#C6A8FF26;
    --ios-bg:#000000; --ios-card:#1C1C1E; --ios-txt:#FFFFFF; --ios-dim:#98989F;
    --ios-sep:#38383A; --ios-blue:#0A84FF;
    --shadow-s:0 1px 2px rgba(0,0,0,.35); --shadow-m:0 14px 36px rgba(0,0,0,.55);
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --ground:#F6F6F7; --surf:#FFFFFF; --ink:#14161A; --ink-2:#5C636D; --ink-3:#8B929C; --hair:#E7E8EB;
    --c-txt:#B4761C; --c-img:#7B55B4; --c-doc:#356BA6; --c-lnk:#BA5138;
    --accent-soft:#7B55B422;
    --ios-bg:#F2F2F7; --ios-card:#FFFFFF; --ios-txt:#000000; --ios-dim:#8A8A8E;
    --ios-sep:#E5E5EA; --ios-blue:#007AFF;
    --shadow-s:0 1px 2px rgba(16,20,26,.05),0 4px 12px rgba(16,20,26,.05);
    --shadow-m:0 2px 6px rgba(16,20,26,.07),0 14px 34px rgba(16,20,26,.09);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font:15px/1.5 var(--ui);
    display:flex;flex-direction:column}

  /* ---------- top: explainer + chips ---------- */
  .top{padding:12px 14px 0;flex:0 0 auto}
  .top h1{font-family:var(--display);font-weight:700;font-size:15.5px;margin:0 0 2px;letter-spacing:-.025em}
  .top p{margin:0;font-size:12.5px;color:var(--ink-2)}
  .top b.us{color:var(--accent)} .top b.sys{color:var(--ink-3)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;flex:0 0 auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--hair);
    background:var(--surf);color:var(--ink-2);border-radius:999px;padding:7px 13px;
    font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip[data-on="1"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  .nav{display:flex;gap:8px;align-items:center;padding:0 14px 8px;flex:0 0 auto}
  .nav button{border:1.5px solid var(--hair);background:var(--surf);color:var(--ink);
    border-radius:9px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .meta{flex:1;font-size:12px;color:var(--ink-2);line-height:1.35}
  .tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;padding:2px 7px;border-radius:5px;color:var(--ground);margin-right:6px;vertical-align:1px}

  /* ---------- the screen ---------- */
  .stage{flex:1;min-height:0;padding:0 10px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .frame{position:relative;width:100%;max-width:400px;height:100%;
    border-radius:22px;overflow:hidden;box-shadow:var(--shadow-m);border:1px solid var(--hair)}
  .scr{position:absolute;inset:0;background:var(--ios-bg);display:flex;flex-direction:column;
    font-family:-apple-system,"SF Pro Text",ui-sans-serif,system-ui,sans-serif;color:var(--ios-txt)}

  /* desktop: add bezel + side notes */
  @media (min-width:860px){
    body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;justify-content:center;
      gap:26px;padding:26px;height:auto;min-height:100%}
    .top{flex-basis:100%;max-width:820px;padding:0}
    .chips{flex-basis:100%;max-width:820px;padding:10px 0}
    .nav{display:none}
    .stage{flex:0 0 auto;padding:0;height:auto}
    .frame{width:352px;height:712px;border:10px solid #101317;border-radius:46px}
    .desk{display:block;flex:0 0 320px;max-width:360px}
    .desk .card{background:var(--surf);border:1px solid var(--hair);border-radius:14px;
      padding:15px;margin-bottom:13px;box-shadow:var(--shadow-s);font-size:13px;color:var(--ink-2)}
    .desk h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin:0 0 8px}
    .desk b{color:var(--ink)}
  }
  .desk{display:none}

  /* ---------- iOS bits ---------- */
  .sb{height:44px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 22px 5px;font-size:13px;font-weight:600}
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
  .lt{font-size:30px;font-weight:700;letter-spacing:-.028em;padding:4px 16px 8px}
  .srch{margin:0 14px 12px;height:36px;border-radius:10px;background:var(--ios-sep);
    display:flex;align-items:center;padding:0 10px;color:var(--ios-dim);font-size:15px;gap:6px}
  .sec{font-size:12.5px;font-weight:600;color:var(--ios-dim);text-transform:uppercase;
    letter-spacing:.045em;padding:12px 16px 6px}
  .grp{background:var(--ios-card);margin:0 12px;border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:.5px solid var(--ios-sep);
    font-size:15.5px;cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--ios-sep)}
  .row .ic{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:15px;flex:0 0 auto;background:var(--accent-soft);color:var(--accent)}
  .row .tx{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .row .sub{font-size:12.5px;color:var(--ios-dim);margin-top:1px}
  .row .cnt{color:var(--ios-dim);font-size:14.5px}
  .row .chev{color:#C4C4C6;font-size:15px}
  .tabbar{flex:0 0 auto;height:64px;background:var(--ios-card);border-top:.5px solid var(--ios-sep);
    display:flex;padding-top:8px}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ios-dim)}
  .tab.on{color:var(--accent)}
  .tab .g{font-size:20px;line-height:1}
  .fab{position:absolute;right:16px;bottom:82px;width:54px;height:54px;border-radius:50%;
    background:var(--accent);color:var(--ground);display:flex;align-items:center;justify-content:center;
    font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;z-index:5}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ios-card);
    border-radius:16px 16px 0 0;padding:9px 0 20px;z-index:8;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .grab{width:36px;height:5px;border-radius:3px;background:#C6C6C8;margin:0 auto 12px}
  .wgwrap{padding:26px 16px;display:flex;flex-direction:column;gap:16px;align-items:center}
  .wg{width:152px;height:152px;border-radius:22px;background:var(--ios-card);padding:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:6px}
  .wg.med{width:100%;height:152px}
  .wgh{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ios-dim);font-weight:600}
  .wgi{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 7px;border-radius:8px;
    background:var(--ios-sep);overflow:hidden;white-space:nowrap}
  .wgg{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
  .spot{position:absolute;inset:0;background:rgba(10,14,18,.66);backdrop-filter:blur(16px);
    display:flex;flex-direction:column;padding-top:52px;z-index:7}
  .spotf{margin:0 14px 14px;height:40px;border-radius:11px;background:rgba(255,255,255,.22);
    display:flex;align-items:center;padding:0 12px;color:#fff;font-size:16px;gap:8px}
  .spotg{background:rgba(255,255,255,.14);margin:0 14px;border-radius:13px;overflow:hidden}
  .spotr{display:flex;align-items:center;gap:11px;padding:11px 13px;color:#fff;font-size:15px;
    border-bottom:.5px solid rgba(255,255,255,.12)}
  .spotr:last-child{border-bottom:none}
  .spotl{color:rgba(255,255,255,.65);font-size:11.5px;padding:13px 16px 6px;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em}
  .navbar{height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;font-size:16px;border-bottom:.5px solid var(--ios-sep);background:var(--ios-card)}
  .navbar .t{font-weight:600;font-size:16.5px}
  .navbar .b{color:var(--ios-blue)}
  #dialsvg{width:100%;flex:1;display:block;min-height:0}

  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(90px);
    background:var(--ink);color:var(--ground);border-radius:11px;
    padding:9px 15px;font-size:13px;z-index:60;transition:transform .22s;max-width:86vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="top">
  <h1>The iOS app — 8 mock screens</h1>
  <p>Nothing here is a real app — it's a picture tour. Pick a screen below. <b class="us">Purple</b> = screens we design. <b class="sys">Grey</b> = iOS draws them, our stuff just appears in them.</p>
</div>

<div class="chips" id="chips"></div>

<div class="nav">
  <button id="prev">‹ Prev</button>
  <div class="meta" id="meta"></div>
  <button id="next">Next ›</button>
</div>

<div class="stage"><div class="frame"><div class="scr" id="scr"></div></div></div>

<aside class="desk" id="desk"></aside>

<div id="toast" role="status"></div>

<script>
'use strict';
/* Icon set: same stroke language as app-mockup.html (24-box, 1.7 stroke,
   round caps). Shared names carry the exact same path data. Never emoji. */
const I={
  txt:'<path d="M5 5.5h14M5 12h14M5 18.5h9"/>',
  img:'<rect x="3.5" y="5.5" width="17" height="13" rx="2.6"/><circle cx="8.7" cy="10.2" r="1.5"/><path d="m4.5 16.4 4-4a1.6 1.6 0 0 1 2.2 0l2.3 2.3M13.6 15.4l2-2a1.6 1.6 0 0 1 2.2 0l1.7 1.7"/>',
  doc:'<path d="M6.5 3h7L18 7.5V21H6.5z"/><path d="M13.3 3v4.6H18"/>',
  fAny:'<path d="M6.5 3h7L18 7.5V21H6.5z"/><path d="M13.3 3v4.6H18"/>',
  fDoc:'<path d="M6.5 3h7L18 7.5V21H6.5z"/><path d="M13.3 3v4.6H18"/><path d="M9.2 12.6h5.6M9.2 15.4h5.6M9.2 18.2h3.4"/>',
  lnk:'<path d="M10.4 13.6a4.1 4.1 0 0 0 5.8 0l2.3-2.3a4.1 4.1 0 0 0-5.8-5.8l-1.2 1.2"/><path d="M13.6 10.4a4.1 4.1 0 0 0-5.8 0l-2.3 2.3a4.1 4.1 0 0 0 5.8 5.8l1.2-1.2"/>',
  copy:'<rect x="8.6" y="8.6" width="12.4" height="12.4" rx="2.6"/><path d="M15.4 5.6V5A2 2 0 0 0 13.4 3H5A2 2 0 0 0 3 5v8.4a2 2 0 0 0 2 2h.6"/>',
  find:'<circle cx="11" cy="11" r="6.4"/><path d="m15.6 15.6 4 4"/>',
  cog:'<circle cx="12" cy="12" r="3.1"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.4 5.4 7.2 7.2M16.8 16.8l1.8 1.8M18.6 5.4 16.8 7.2M7.2 16.8l-1.8 1.8"/>',
  send:'<path d="M12 15.6V3.4"/><path d="m8.4 6.8 3.6-3.4 3.6 3.4"/><path d="M6.8 10.6H5.2v10h13.6v-10h-1.6"/>',
  pin:'<path d="M9.5 3h5v5.6l2.3 3.1v2.1H7.2v-2.1L9.5 8.6z"/><path d="M12 13.8V21"/>',
  tag:'<path d="M3.5 11V4.5a1 1 0 0 1 1-1H11a2 2 0 0 1 1.4.6l7.6 7.6a2 2 0 0 1 0 2.8L14.6 20a2 2 0 0 1-2.8 0L4.1 12.4A2 2 0 0 1 3.5 11z"/><circle cx="8.3" cy="8.3" r="1.4"/>',
  pencil:'<path d="M16.4 3.6a2.3 2.3 0 0 1 3.3 3.3L8.2 18.4l-4.3 1 1-4.3z"/><path d="m14.6 5.4 4 4"/>',
  mail:'<rect x="3.4" y="5.4" width="17.2" height="13.2" rx="2.4"/><path d="m4.6 7.6 7.4 5.4 7.4-5.4"/>',
  phone:'<rect x="7" y="2.8" width="10" height="18.4" rx="2.6"/><path d="M10.8 18.2h2.4"/>',
  home:'<path d="m4 11.2 8-7.2 8 7.2"/><path d="M6.2 9.8v10.4h11.6V9.8"/><path d="M10 20.2v-5.6h4v5.6"/>',
  person:'<circle cx="12" cy="8.2" r="3.6"/><path d="M5.4 20.2a6.6 6.6 0 0 1 13.2 0"/>',
  people:'<circle cx="9" cy="8.6" r="3.2"/><path d="M3.2 19.6a5.8 5.8 0 0 1 11.6 0"/><path d="M15.2 5.9a3.2 3.2 0 0 1 0 5.4M17 13.9a5.8 5.8 0 0 1 3.6 5.3"/>',
  target:'<circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r=".9"/>',
  eye:'<path d="M2.8 12c2.2-4 5.3-6 9.2-6s7 2 9.2 6c-2.2 4-5.3 6-9.2 6s-7-2-9.2-6z"/><circle cx="12" cy="12" r="2.7"/>',
  cloud:'<path d="M7.2 18.6a4.3 4.3 0 0 1-.7-8.5 5.5 5.5 0 0 1 10.8 1.1 3.7 3.7 0 0 1-.7 7.4z"/>',
  folder:'<path d="M3.4 6.4a1.8 1.8 0 0 1 1.8-1.8h4.1l2 2.3h7.5a1.8 1.8 0 0 1 1.8 1.8v8.9a1.8 1.8 0 0 1-1.8 1.8H5.2a1.8 1.8 0 0 1-1.8-1.8z"/>',
  case:'<rect x="3.4" y="7.6" width="17.2" height="11.8" rx="2.2"/><path d="M9 7.6V5.8a1.6 1.6 0 0 1 1.6-1.6h2.8A1.6 1.6 0 0 1 15 5.8v1.8M3.4 12.4h17.2"/>',
  cal:'<rect x="3.6" y="5" width="16.8" height="15.2" rx="2.4"/><path d="M3.6 9.8h16.8M8.2 3v3.6M15.8 3v3.6"/>',
  lib:'<path d="M4.4 4.6h3.4v14.8H4.4zM9.6 4.6H13v14.8H9.6z"/><path d="m14.8 5.5 3.3-.8 3.4 14.4-3.3.8z"/>',
};
const ic=(n,s,w)=>`<svg viewBox="0 0 24 24" width="${s||16}" height="${s||16}" fill="none" stroke="currentColor" stroke-width="${w||1.7}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

const ITEMS={
  Clipboard:[['mail','Email','alex.rivera@example.com'],['phone','Phone','+1 (614) 555-0164'],['home','Address','482 Maple Grove Ave…']],
  Snippets:[['person','Full name','Alex Rivera'],['target','Why-us opener','I’ve followed your design work…'],['send','Follow-up','Just floating this back…'],['pencil','Signature','Best, Alex Rivera']],
  Docs:[['fDoc','Resume.pdf','248 KB · PDF'],['fAny','Cover-letter.pdf','96 KB · PDF'],['fAny','Transcript.pdf','1.1 MB · PDF']],
  Images:[['img','Headshot','JPEG · 2.1 MB'],['img','Portfolio cover','PNG · 840 KB']],
  Links:[['lnk','Portfolio','alexrivera.example.com'],['case','LinkedIn','linkedin.example.com'],['cal','Calendly','cal.example.com']]
};
const COLS=Object.keys(ITEMS);
const ICON={Clipboard:'copy',Snippets:'txt',Docs:'doc',Images:'img',Links:'lnk'};
const sb=`<div class="sb"><span>9:41</span><span>5G ▮▮▮</span></div>`;
const tabs=on=>`<div class="tabbar">${[['Library','lib'],['Search','find'],['Settings','cog']].map((t,i)=>
  `<div class="tab ${i===on?'on':''}">${ic(t[1],21)}${t[0]}</div>`).join('')}</div>`;

const SCREENS={
  library:{own:1,name:'Library',cap:'The app. Plain iOS lists on purpose — content reads fast, chrome disappears.',
    html:()=>`${sb}<div class="body">
      <div class="lt">Library</div>
      <div class="srch">${ic('find',15)} Search everything</div>
      <div class="sec">Pinned</div>
      <div class="grp">
        ${ITEMS.Snippets.slice(3,4).concat(ITEMS.Clipboard.slice(0,1)).map(i=>
          `<div class="row"><div class="ic">${ic(i[0],16)}</div><div class="tx">${i[1]}<div class="sub">${i[2]}</div></div></div>`).join('')}
      </div>
      <div class="sec">Collections</div>
      <div class="grp">
        ${COLS.map(c=>`<div class="row" data-live="1" onclick="go('collection')"><div class="ic">${ic(ICON[c],16)}</div>
          <div class="tx">${c}</div><span class="cnt">${ITEMS[c].length}</span><span class="chev">›</span></div>`).join('')}
      </div>
      <div style="height:24px"></div>
    </div><div class="fab" data-live="1" onclick="go('retrieve')">◎</div>${tabs(0)}`},

  collection:{own:1,name:'Collection',cap:'Inside Docs. PDFs and images sit in one list with the same look — no special cases to learn.',
    html:()=>`${sb}<div class="body">
      <div style="padding:6px 14px 0;font-size:16px;color:var(--ios-blue);cursor:pointer" data-live="1" onclick="go('library')">‹ Library</div>
      <div class="lt">Docs</div>
      <div class="srch">${ic('find',15)} Search Docs</div>
      <div class="grp">
        ${ITEMS.Docs.map(i=>`<div class="row" data-live="1" onclick="go('item')"><div class="ic">${ic(i[0],16)}</div>
          <div class="tx">${i[1]}<div class="sub">${i[2]}</div></div><span class="chev">›</span></div>`).join('')}
      </div>
      <div class="sec">Also here</div>
      <div class="grp">
        ${ITEMS.Images.map(i=>`<div class="row"><div class="ic">${ic(i[0],16)}</div>
          <div class="tx">${i[1]}<div class="sub">${i[2]}</div></div><span class="chev">›</span></div>`).join('')}
      </div>
    </div>${tabs(0)}`},

  item:{own:1,name:'Item sheet',cap:'Tap an item, get a sheet. One big obvious action; the rest stays quiet.',
    html:()=>`${sb}<div class="body" style="filter:brightness(.62)">
      <div class="lt">Docs</div>
      <div class="grp">${ITEMS.Docs.map(i=>`<div class="row"><div class="ic">${ic(i[0],16)}</div><div class="tx">${i[1]}<div class="sub">${i[2]}</div></div></div>`).join('')}</div>
    </div>
    <div class="sheet">
      <div class="grab"></div>
      <div style="padding:0 16px">

const ORDER=['library','collection','item','retrieve','widget','spotlight','files','share'];
let cur='library';

function go(k){cur=k;render();}
window.go=go;

function render(){
  const s=SCREENS[cur];
  document.getElementById('scr').innerHTML=s.html();
  const own=s.own;
  document.getElementById('meta').innerHTML=
    `<span class="tag" style="background:${own?'var(--accent)':'var(--ink-3)'}">${own?'we design this':'iOS draws this'}</span>${s.cap}`;
  [...document.getElementById('chips').children].forEach(el=>el.dataset.on=el.dataset.k===cur?'1':'0');
  document.querySelector(`.chip[data-k="${cur}"]`)?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  if(cur==='retrieve')drawDial();
  document.getElementById('desk').innerHTML=`<div class="card"><h2>Reading this</h2>
    On Android the dial is the product's face. On iOS, three of our best surfaces are drawn by
    Apple (<b>Spotlight, Files, share sheet</b>) — zero setup, our content inside their pixels.
    Our own design shows up in four places: <b>the app, the item sheet, the dial, widgets</b>.</div>
    <div class="card"><h2>Current screen</h2><span class="tag" style="background:${own?'var(--accent)':'var(--ink-3)'}">${own?'ours':'iOS'}</span>${s.cap}</div>`;
}

/* dead taps say so instead of doing nothing */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
document.getElementById('scr').addEventListener('click',e=>{
  if(e.target.closest('[data-live]'))return;
  if(e.target.closest('.row,.fab,.wgi,.spotr'))toast('Just a picture — use the chips up top to move around');
});

/* chips + prev/next */
const chips=document.getElementById('chips');
chips.innerHTML=ORDER.map(k=>`<button class="chip" data-k="${k}">
  <span class="dot" style="background:${SCREENS[k].own?'var(--accent)':'var(--ink-3)'}"></span>${SCREENS[k].name}</button>`).join('');
[...chips.children].forEach(el=>el.onclick=()=>go(el.dataset.k));
document.getElementById('prev').onclick=()=>go(ORDER[(ORDER.indexOf(cur)+ORDER.length-1)%ORDER.length]);
document.getElementById('next').onclick=()=>go(ORDER[(ORDER.indexOf(cur)+1)%ORDER.length]);

/* swipe left/right on the screen switches screens (mobile) */
let sx=null,sy=null;
const scr=document.getElementById('scr');
scr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
scr.addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6)
    document.getElementById(dx<0?'next':'prev').click();
},{passive:true});

/* --- dial (bottom-pivot half lens) --- */
function drawDial(){
  const svg=document.getElementById('dialsvg');if(!svg)return;
  const cx=170,cy=352,R1i=56,R1o=98,R2i=106,R2o=150;
  const rad=d=>(d-90)*Math.PI/180;
  const P=(r,d)=>({x:cx+r*Math.cos(rad(d)),y:cy+r*Math.sin(rad(d))});
  const seg=(r0,r1,a0,a1)=>{const p1=P(r1,a0),p2=P(r1,a1),p3=P(r0,a1),p4=P(r0,a0);
    return `M${p1.x} ${p1.y}A${r1} ${r1} 0 0 1 ${p2.x} ${p2.y}L${p3.x} ${p3.y}A${r0} ${r0} 0 0 0 ${p4.x} ${p4.y}Z`;};
  const dark=matchMedia('(prefers-color-scheme:dark)').matches
    ||document.documentElement.dataset.theme==='dark';
  const barrel=dark?'#22272E':'#EDEDF0', edge=dark?'#333B45':'#D7D7DC', knurl=dark?'#3B4550':'#C6C6CC';
  const css=getComputedStyle(document.documentElement);
  const acc=css.getPropertyValue('--accent').trim()||css.getPropertyValue('--c-img').trim();
  const inkc=css.getPropertyValue('--ink').trim();
  const gicon=(n,p,S,o)=>`<g transform="translate(${(p.x-S/2).toFixed(1)} ${(p.y-S/2).toFixed(1)}) scale(${(S/24).toFixed(3)})" fill="none" stroke="${inkc}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="${o}">${I[n]}</g>`;
  const A0=282,A1=438;
  let h=`<path d="${seg(R1i,R1o,A0,A1)}" fill="${barrel}" stroke="${edge}"/>`;
  h+=`<path d="${seg(R2i,R2o,A0,A1)}" fill="${barrel}" stroke="${edge}"/>`;
  for(let a=A0;a<=A1;a+=6){const p1=P(R2o,a),p2=P(R2o+6,a);
    h+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${knurl}" stroke-width="1.5"/>`;}
  h+=`<path d="${seg(R1i+2,R1o-2,339,381)}" fill="${acc}" opacity=".16"/>`;
  h+=`<path d="${seg(R2i+2,R2o-2,344,376)}" fill="${acc}" opacity=".13"/>`;
  [[-42,'copy'],[0,'txt'],[42,'doc']].forEach(([o,n])=>{
    const p=P((R1i+R1o)/2,360+o);
    h+=gicon(n,p,o?15:19,o?.5:1);});
  [[-62,'person'],[-31,'target'],[0,'pencil'],[31,'send'],[62,'people']].forEach(([o,n])=>{
    const p=P((R2i+R2o)/2,360+o);
    h+=gicon(n,p,o?14:17,o?.45:1);});
  const m1=P(R2o+8,360),m2=P(R2o+16,360);
  h+=`<line x1="${m1.x}" y1="${m1.y}" x2="${m2.x}" y2="${m2.y}" stroke="#FF3B30" stroke-width="3.5" stroke-linecap="round"/>`;
  h+=`<circle cx="${cx}" cy="${cy}" r="${R1i-8}" fill="${barrel}" stroke="${edge}"/>`;
  h+=`<circle cx="${cx}" cy="${cy}" r="9" fill="${acc}"/>`;
  svg.innerHTML=h;
}
render();
</script>
