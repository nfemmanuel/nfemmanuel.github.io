<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iOS screens — a guided tour</title>
<style>
  :root{
    --paper:#F2F1EC; --panel:#FFFFFF; --ink:#1D2126; --dim:#6B7280; --line:#E2DED4;
    --accent:#0E8C7F; --accent-soft:#0E8C7F1A;
    --ios-bg:#F2F2F7; --ios-card:#FFFFFF; --ios-txt:#000000; --ios-dim:#8A8A8E;
    --ios-sep:#E5E5EA; --ios-blue:#007AFF;
    --sys:#8A8A8E;
    --shadow:0 10px 28px rgba(28,32,38,.12);
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0F1216; --panel:#171C22; --ink:#E9EDF2; --dim:#8B95A1; --line:#242B33;
    --accent:#2FB9A9; --accent-soft:#2FB9A924;
    --ios-bg:#000000; --ios-card:#1C1C1E; --ios-txt:#FFFFFF; --ios-dim:#98989F;
    --ios-sep:#38383A; --ios-blue:#0A84FF;
    --shadow:0 10px 28px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --paper:#0F1216; --panel:#171C22; --ink:#E9EDF2; --dim:#8B95A1; --line:#242B33;
    --accent:#2FB9A9; --accent-soft:#2FB9A924;
    --ios-bg:#000000; --ios-card:#1C1C1E; --ios-txt:#FFFFFF; --ios-dim:#98989F;
    --ios-sep:#38383A; --ios-blue:#0A84FF;
    --shadow:0 10px 28px rgba(0,0,0,.5);
  }
  :root[data-theme="light"]{
    --paper:#F2F1EC; --panel:#FFFFFF; --ink:#1D2126; --dim:#6B7280; --line:#E2DED4;
    --accent:#0E8C7F; --accent-soft:#0E8C7F1A;
    --ios-bg:#F2F2F7; --ios-card:#FFFFFF; --ios-txt:#000000; --ios-dim:#8A8A8E;
    --ios-sep:#E5E5EA; --ios-blue:#007AFF;
    --shadow:0 10px 28px rgba(28,32,38,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column}

  /* ---------- top: explainer + chips ---------- */
  .top{padding:12px 14px 0;flex:0 0 auto}
  .top h1{font-size:15.5px;margin:0 0 2px;letter-spacing:-.01em}
  .top p{margin:0;font-size:12.5px;color:var(--dim)}
  .top b.us{color:var(--accent)} .top b.sys{color:var(--sys)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:10px 14px;flex:0 0 auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);
    background:var(--panel);color:var(--dim);border-radius:999px;padding:7px 13px;
    font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chip .dot{width:8px;height:8px;border-radius:50%}
  .chip[data-on="1"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  .nav{display:flex;gap:8px;align-items:center;padding:0 14px 8px;flex:0 0 auto}
  .nav button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
    border-radius:9px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .meta{flex:1;font-size:12px;color:var(--dim);line-height:1.35}
  .tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;padding:2px 7px;border-radius:5px;color:#fff;margin-right:6px;vertical-align:1px}

  /* ---------- the screen ---------- */
  .stage{flex:1;min-height:0;padding:0 10px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  .frame{position:relative;width:100%;max-width:400px;height:100%;
    border-radius:22px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
  .scr{position:absolute;inset:0;background:var(--ios-bg);display:flex;flex-direction:column;
    font-family:-apple-system,"SF Pro Text",ui-sans-serif,system-ui,sans-serif;color:var(--ios-txt)}

  /* desktop: add bezel + side notes */
  @media (min-width:860px){
    body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;justify-content:center;
      gap:26px;padding:26px;height:auto;min-height:100%}
    .top{flex-basis:100%;max-width:820px;padding:0}
    .chips{flex-basis:100%;max-width:820px;padding:10px 0}
    .nav{display:none}
    .stage{flex:0 0 auto;padding:0;height:auto}
    .frame{width:352px;height:712px;border:10px solid #101317;border-radius:46px}
    .desk{display:block;flex:0 0 320px;max-width:360px}
    .desk .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
      padding:15px;margin-bottom:13px;box-shadow:var(--shadow);font-size:13px;color:var(--dim)}
    .desk h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
    .desk b{color:var(--ink)}
  }
  .desk{display:none}

  /* ---------- iOS bits ---------- */
  .sb{height:44px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 22px 5px;font-size:13px;font-weight:600}
  .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
  .lt{font-size:30px;font-weight:700;letter-spacing:-.028em;padding:4px 16px 8px}
  .srch{margin:0 14px 12px;height:36px;border-radius:10px;background:var(--ios-sep);
    display:flex;align-items:center;padding:0 10px;color:var(--ios-dim);font-size:15px;gap:6px}
  .sec{font-size:12.5px;font-weight:600;color:var(--ios-dim);text-transform:uppercase;
    letter-spacing:.045em;padding:12px 16px 6px}
  .grp{background:var(--ios-card);margin:0 12px;border-radius:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:.5px solid var(--ios-sep);
    font-size:15.5px;cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--ios-sep)}
  .row .ic{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:15px;flex:0 0 auto;background:var(--accent-soft)}
  .row .tx{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .row .sub{font-size:12.5px;color:var(--ios-dim);margin-top:1px}
  .row .cnt{color:var(--ios-dim);font-size:14.5px}
  .row .chev{color:#C4C4C6;font-size:15px}
  .tabbar{flex:0 0 auto;height:64px;background:var(--ios-card);border-top:.5px solid var(--ios-sep);
    display:flex;padding-top:8px}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ios-dim)}
  .tab.on{color:var(--accent)}
  .tab .g{font-size:20px;line-height:1}
  .fab{position:absolute;right:16px;bottom:82px;width:54px;height:54px;border-radius:50%;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;z-index:5}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ios-card);
    border-radius:16px 16px 0 0;padding:9px 0 20px;z-index:8;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  .grab{width:36px;height:5px;border-radius:3px;background:#C6C6C8;margin:0 auto 12px}
  .wgwrap{padding:26px 16px;display:flex;flex-direction:column;gap:16px;align-items:center}
  .wg{width:152px;height:152px;border-radius:22px;background:var(--ios-card);padding:12px;
    box-shadow:0 4px 14px rgba(0,0,0,.16);display:flex;flex-direction:column;gap:6px}
  .wg.med{width:100%;height:152px}
  .wgh{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ios-dim);font-weight:600}
  .wgi{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:5px 7px;border-radius:8px;
    background:var(--ios-sep);overflow:hidden;white-space:nowrap}
  .wgg{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
  .spot{position:absolute;inset:0;background:rgba(10,14,18,.66);backdrop-filter:blur(16px);
    display:flex;flex-direction:column;padding-top:52px;z-index:7}
  .spotf{margin:0 14px 14px;height:40px;border-radius:11px;background:rgba(255,255,255,.22);
    display:flex;align-items:center;padding:0 12px;color:#fff;font-size:16px;gap:8px}
  .spotg{background:rgba(255,255,255,.14);margin:0 14px;border-radius:13px;overflow:hidden}
  .spotr{display:flex;align-items:center;gap:11px;padding:11px 13px;color:#fff;font-size:15px;
    border-bottom:.5px solid rgba(255,255,255,.12)}
  .spotr:last-child{border-bottom:none}
  .spotl{color:rgba(255,255,255,.65);font-size:11.5px;padding:13px 16px 6px;font-weight:600;
    text-transform:uppercase;letter-spacing:.05em}
  .navbar{height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;font-size:16px;border-bottom:.5px solid var(--ios-sep);background:var(--ios-card)}
  .navbar .t{font-weight:600;font-size:16.5px}
  .navbar .b{color:var(--ios-blue)}
  #dialsvg{width:100%;flex:1;display:block;min-height:0}

  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(90px);
    background:#1A1F26;color:#E9EDF2;border:1px solid #333B45;border-radius:11px;
    padding:9px 15px;font-size:13px;z-index:60;transition:transform .22s;max-width:86vw;text-align:center}
  #toast.show{transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){#toast{transition:none}}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div class="top">
  <h1>The iOS app — 8 mock screens</h1>
  <p>Nothing here is a real app — it's a picture tour. Pick a screen below. <b class="us">Teal</b> = screens we design. <b class="sys">Grey</b> = iOS draws them, our stuff just appears in them.</p>
</div>

<div class="chips" id="chips"></div>

<div class="nav">
  <button id="prev">‹ Prev</button>
  <div class="meta" id="meta"></div>
  <button id="next">Next ›</button>
</div>

<div class="stage"><div class="frame"><div class="scr" id="scr"></div></div></div>

<aside class="desk" id="desk"></aside>

<div id="toast" role="status"></div>

<script>
'use strict';
const ITEMS={
  Clipboard:[['📧','Email','alex.rivera@example.com'],['📱','Phone','+1 (614) 555-0164'],['🏠','Address','482 Maple Grove Ave…']],
  Snippets:[['👤','Full name','Alex Rivera'],['🎯','Why-us opener','I’ve followed your design work…'],['📮','Follow-up','Just floating this back…'],['✍️','Signature','Best, Alex Rivera']],
  Docs:[['📑','Resume.pdf','248 KB · PDF'],['📃','Cover-letter.pdf','96 KB · PDF'],['🎓','Transcript.pdf','1.1 MB · PDF']],
  Images:[['📸','Headshot','JPEG · 2.1 MB'],['🖼️','Portfolio cover','PNG · 840 KB']],
  Links:[['🌐','Portfolio','alexrivera.example.com'],['💼','LinkedIn','linkedin.example.com'],['📅','Calendly','cal.example.com']]
};
const COLS=Object.keys(ITEMS);
const ICON={Clipboard:'📋',Snippets:'✂️',Docs:'📄',Images:'🖼️',Links:'🔗'};
const sb=`<div class="sb"><span>9:41</span><span>5G ▮▮▮</span></div>`;
const tabs=on=>`<div class="tabbar">${[['Library','📚'],['Search','🔍'],['Settings','⚙️']].map((t,i)=>
  `<div class="tab ${i===on?'on':''}"><span class="g">${t[1]}</span>${t[0]}</div>`).join('')}</div>`;

const SCREENS={
  library:{own:1,name:'Library',cap:'The app. Plain iOS lists on purpose — content reads fast, chrome disappears.',
    html:()=>`${sb}<div class="body">
      <div class="lt">Library</div>
      <div class="srch">🔍 Search everything</div>
      <div class="sec">Pinned</div>
      <div class="grp">
        ${ITEMS.Snippets.slice(3,4).concat(ITEMS.Clipboard.slice(0,1)).map(i=>
          `<div class="row"><div class="ic">${i[0]}</div><div class="tx">${i[1]}<div class="sub">${i[2]}</div></div></div>`).join('')}
      </div>
      <div class="sec">Collections</div>
      <div class="grp">
        ${COLS.map(c=>`<div class="row" data-live="1" onclick="go('collection')"><div class="ic">${ICON[c]}</div>
          <div class="tx">${c}</div><span class="cnt">${ITEMS[c].length}</span><span class="chev">›</span></div>`).join('')}
      </div>
      <div style="height:24px"></div>
    </div><div class="fab" data-live="1" onclick="go('retrieve')">◎</div>${tabs(0)}`},

  collection:{own:1,name:'Collection',cap:'Inside Docs. PDFs and images sit in one list with the same look — no special cases to learn.',
    html:()=>`${sb}<div class="body">
      <div style="padding:6px 14px 0;font-size:16px;color:var(--ios-blue);cursor:pointer" data-live="1" onclick="go('library')">‹ Library</div>
      <div class="lt">Docs</div>
      <div class="srch">🔍 Search Docs</div>
      <div class="grp">
        ${ITEMS.Docs.map(i=>`<div class="row" data-live="1" onclick="go('item')"><div class="ic">${i[0]}</div>
          <div class="tx">${i[1]}<div class="sub">${i[2]}</div></div><span class="chev">›</span></div>`).join('')}
      </div>
      <div class="sec">Also here</div>
      <div class="grp">
        ${ITEMS.Images.map(i=>`<div class="row"><div class="ic">${i[0]}</div>
          <div class="tx">${i[1]}<div class="sub">${i[2]}</div></div><span class="chev">›</span></div>`).join('')}
      </div>
    </div>${tabs(0)}`},

  item:{own:1,name:'Item sheet',cap:'Tap an item, get a sheet. One big obvious action; the rest stays quiet.',
    html:()=>`${sb}<div class="body" style="filter:brightness(.62)">
      <div class="lt">Docs</div>
      <div class="grp">${ITEMS.Docs.map(i=>`<div class="row"><div class="ic">${i[0]}</div><div class="tx">${i[1]}<div class="sub">${i[2]}</div></div></div>`).join('')}</div>
    </div>
    <div class="sheet">
      <div class="grab"></div>
      <div style="padding:0 16px">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">
          <div style="width:50px;height:50px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:24px">📑</div>
          <div><div style="font-size:18px;font-weight:650">Resume.pdf</div>
          <div style="font-size:13px;color:var(--ios-dim)">248 KB · added 3 days ago · used 6×</div></div>
        </div>
        <div style="background:var(--accent);color:#fff;border-radius:12px;padding:12px;text-align:center;font-size:16px;font-weight:600;margin-bottom:9px">Copy</div>
        <div class="grp" style="margin:0">
          <div class="row"><div class="ic">📤</div><div class="tx">Share…</div></div>
          <div class="row"><div class="ic">👁️</div><div class="tx">Preview</div></div>
          <div class="row"><div class="ic">📌</div><div class="tx">Pin to top</div></div>
          <div class="row"><div class="ic">🏷️</div><div class="tx">Collections &amp; tags</div></div>
        </div>
      </div>
    </div>${tabs(0)}`},

  retrieve:{own:1,name:'Quick retrieve',cap:'The dial, living inside the app — same object as Android, pivoted to the thumb.',
    html:()=>`${sb}<div class="body" style="display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;padding:6px 16px 2px;font-size:16px;color:var(--ios-blue)">
        <span data-live="1" onclick="go('library')" style="cursor:pointer">Cancel</span><span style="opacity:.4">Edit</span></div>
      <div style="text-align:center;font-size:13px;color:var(--ios-dim);padding:4px 0 0">Turn to choose · tap to copy</div>
      <svg id="dialsvg" viewBox="0 0 340 380"></svg>
      <div style="text-align:center;padding:0 22px 12px">
        <div style="font-size:19px;font-weight:650">Signature</div>
        <div style="font-size:13px;color:var(--ios-dim);margin-top:2px">Snippets · used 24×</div>
      </div>
    </div>${tabs(0)}`},

  widget:{own:1,name:'Widgets',cap:'Home-screen widgets. Tap one and the item is copied — the app never opens.',
    html:()=>`${sb}<div class="body" style="background:linear-gradient(165deg,#2b3a44,#151b21)">
      <div class="wgwrap">
        <div style="align-self:stretch;color:#fff;opacity:.55;font-size:12px;text-align:center">Home Screen</div>
        <div class="wg">
          <div class="wgh">◎ PINNED</div>
          <div class="wgg">
            ${[['✍️','Signature'],['📧','Email'],['📱','Phone'],['🌐','Portfolio']].map(i=>
              `<div class="wgi" style="justify-content:center;flex-direction:column;gap:2px">
                <span style="font-size:16px">${i[0]}</span><span style="font-size:10px">${i[1]}</span></div>`).join('')}
          </div>
        </div>
        <div class="wg med">
          <div class="wgh">◎ RECENT</div>
          ${[['📑','Resume.pdf'],['🎯','Why-us opener'],['💼','LinkedIn']].map(i=>
            `<div class="wgi"><span>${i[0]}</span><span>${i[1]}</span></div>`).join('')}
        </div>
      </div>
    </div>`},

  spotlight:{own:0,name:'Spotlight',cap:'Swipe down, type two letters, your snippet is right there. iOS draws all of this — we just supply the items. Zero setup.',
    html:()=>`${sb}<div class="body" style="background:linear-gradient(165deg,#2b3a44,#151b21)"></div>
      <div class="spot">
        <div class="spotf">🔍 signat…</div>
        <div class="spotl">From our app</div>
        <div class="spotg">
          <div class="spotr"><span>✍️</span><div style="flex:1">Signature<div style="font-size:12px;opacity:.6">Best, Alex Rivera</div></div></div>
          <div class="spotr"><span>◎</span><div style="flex:1">Copy Signature<div style="font-size:12px;opacity:.6">Shortcut action</div></div></div>
        </div>
        <div class="spotl">Applications</div>
        <div class="spotg"><div class="spotr"><span>◎</span><div style="flex:1">Open the app</div></div></div>
      </div>`},

  files:{own:0,name:'Files picker',cap:'You are in Mail, attaching a file. We show up as a place, next to iCloud. Tap the resume, it attaches. You never left Mail.',
    html:()=>`${sb}
      <div class="navbar"><span class="b">Cancel</span><span class="t">Browse</span><span class="b">Select</span></div>
      <div class="body">
        <div class="srch" style="margin-top:12px">🔍 Search</div>
        <div class="sec">Locations</div>
        <div class="grp">
          <div class="row"><div class="ic" style="background:#E8F0FE">☁️</div><div class="tx">iCloud Drive</div><span class="chev">›</span></div>
          <div class="row" style="background:var(--accent-soft)"><div class="ic">◎</div><div class="tx"><b>Our app</b><div class="sub">Docs · Images</div></div><span class="chev">›</span></div>
          <div class="row"><div class="ic" style="background:#EDEDF0">📁</div><div class="tx">On My iPhone</div><span class="chev">›</span></div>
        </div>
        <div class="sec">Our app · Docs</div>
        <div class="grp">
          ${ITEMS.Docs.map(i=>`<div class="row"><div class="ic">${i[0]}</div><div class="tx">${i[1]}<div class="sub">${i[2]}</div></div></div>`).join('')}
        </div>
      </div>`},

  share:{own:0,name:'Share sheet',cap:'Saving something in. You are in Safari, hit share, tap us, done. iOS owns the sheet; the small panel is ours.',
    html:()=>`${sb}<div class="body" style="filter:brightness(.5)">
        <div class="lt">Safari</div><div style="padding:0 16px;color:var(--ios-dim);font-size:14px">alexrivera.example.com</div>
      </div>
      <div class="sheet" style="padding-bottom:18px">
        <div class="grab"></div>
        <div style="padding:0 15px">
          <div style="display:flex;gap:11px;align-items:center;margin-bottom:13px">
            <div style="width:42px;height:42px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px">◎</div>
            <div style="flex:1"><div style="font-weight:650;font-size:16px">Save</div>
            <div style="font-size:12.5px;color:var(--ios-dim)">Portfolio — alexrivera.example.com</div></div>
          </div>
          <div class="grp" style="margin:0 0 10px">
            <div class="row"><div class="ic">🔗</div><div class="tx">Collection</div><span class="cnt">Links</span><span class="chev">›</span></div>
            <div class="row"><div class="ic">🏷️</div><div class="tx">Tags</div><span class="cnt">none</span><span class="chev">›</span></div>
          </div>
          <div style="background:var(--accent);color:#fff;border-radius:12px;padding:12px;text-align:center;font-size:16px;font-weight:600">Save</div>
        </div>
      </div>`}
};

const ORDER=['library','collection','item','retrieve','widget','spotlight','files','share'];
let cur='library';

function go(k){cur=k;render();}
window.go=go;

function render(){
  const s=SCREENS[cur];
  document.getElementById('scr').innerHTML=s.html();
  const own=s.own;
  document.getElementById('meta').innerHTML=
    `<span class="tag" style="background:${own?'var(--accent)':'var(--sys)'}">${own?'we design this':'iOS draws this'}</span>${s.cap}`;
  [...document.getElementById('chips').children].forEach(el=>el.dataset.on=el.dataset.k===cur?'1':'0');
  document.querySelector(`.chip[data-k="${cur}"]`)?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  if(cur==='retrieve')drawDial();
  document.getElementById('desk').innerHTML=`<div class="card"><h2>Reading this</h2>
    On Android the dial is the product's face. On iOS, three of our best surfaces are drawn by
    Apple (<b>Spotlight, Files, share sheet</b>) — zero setup, our content inside their pixels.
    Our own design shows up in four places: <b>the app, the item sheet, the dial, widgets</b>.</div>
    <div class="card"><h2>Current screen</h2><span class="tag" style="background:${own?'var(--accent)':'var(--sys)'}">${own?'ours':'iOS'}</span>${s.cap}</div>`;
}

/* dead taps say so instead of doing nothing */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}
document.getElementById('scr').addEventListener('click',e=>{
  if(e.target.closest('[data-live]'))return;
  if(e.target.closest('.row,.fab,.wgi,.spotr'))toast('Just a picture — use the chips up top to move around');
});

/* chips + prev/next */
const chips=document.getElementById('chips');
chips.innerHTML=ORDER.map(k=>`<button class="chip" data-k="${k}">
  <span class="dot" style="background:${SCREENS[k].own?'var(--accent)':'var(--sys)'}"></span>${SCREENS[k].name}</button>`).join('');
[...chips.children].forEach(el=>el.onclick=()=>go(el.dataset.k));
document.getElementById('prev').onclick=()=>go(ORDER[(ORDER.indexOf(cur)+ORDER.length-1)%ORDER.length]);
document.getElementById('next').onclick=()=>go(ORDER[(ORDER.indexOf(cur)+1)%ORDER.length]);

/* swipe left/right on the screen switches screens (mobile) */
let sx=null,sy=null;
const scr=document.getElementById('scr');
scr.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
scr.addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6)
    document.getElementById(dx<0?'next':'prev').click();
},{passive:true});

/* --- dial (bottom-pivot half lens) --- */
function drawDial(){
  const svg=document.getElementById('dialsvg');if(!svg)return;
  const cx=170,cy=352,R1i=56,R1o=98,R2i=106,R2o=150;
  const rad=d=>(d-90)*Math.PI/180;
  const P=(r,d)=>({x:cx+r*Math.cos(rad(d)),y:cy+r*Math.sin(rad(d))});
  const seg=(r0,r1,a0,a1)=>{const p1=P(r1,a0),p2=P(r1,a1),p3=P(r0,a1),p4=P(r0,a0);
    return `M${p1.x} ${p1.y}A${r1} ${r1} 0 0 1 ${p2.x} ${p2.y}L${p3.x} ${p3.y}A${r0} ${r0} 0 0 0 ${p4.x} ${p4.y}Z`;};
  const dark=matchMedia('(prefers-color-scheme:dark)').matches
    ||document.documentElement.dataset.theme==='dark';
  const barrel=dark?'#22272E':'#EDEDF0', edge=dark?'#333B45':'#D7D7DC', knurl=dark?'#3B4550':'#C6C6CC';
  const acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const A0=282,A1=438;
  let h=`<path d="${seg(R1i,R1o,A0,A1)}" fill="${barrel}" stroke="${edge}"/>`;
  h+=`<path d="${seg(R2i,R2o,A0,A1)}" fill="${barrel}" stroke="${edge}"/>`;
  for(let a=A0;a<=A1;a+=6){const p1=P(R2o,a),p2=P(R2o+6,a);
    h+=`<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${knurl}" stroke-width="1.5"/>`;}
  h+=`<path d="${seg(R1i+2,R1o-2,339,381)}" fill="${acc}" opacity=".16"/>`;
  h+=`<path d="${seg(R2i+2,R2o-2,344,376)}" fill="${acc}" opacity=".13"/>`;
  [[-42,'📋'],[0,'✂️'],[42,'📄']].forEach(([o,ic])=>{
    const p=P((R1i+R1o)/2,360+o);
    h+=`<text x="${p.x}" y="${p.y}" font-size="${o?16:20}" text-anchor="middle" dominant-baseline="central" opacity="${o?.5:1}">${ic}</text>`;});
  [[-62,'👤'],[-31,'🎯'],[0,'✍️'],[31,'📮'],[62,'👥']].forEach(([o,ic])=>{
    const p=P((R2i+R2o)/2,360+o);
    h+=`<text x="${p.x}" y="${p.y}" font-size="${o?15:18}" text-anchor="middle" dominant-baseline="central" opacity="${o?.45:1}">${ic}</text>`;});
  const m1=P(R2o+8,360),m2=P(R2o+16,360);
  h+=`<line x1="${m1.x}" y1="${m1.y}" x2="${m2.x}" y2="${m2.y}" stroke="#FF3B30" stroke-width="3.5" stroke-linecap="round"/>`;
  h+=`<circle cx="${cx}" cy="${cy}" r="${R1i-8}" fill="${barrel}" stroke="${edge}"/>`;
  h+=`<circle cx="${cx}" cy="${cy}" r="9" fill="${acc}"/>`;
  svg.innerHTML=h;
}
render();
</script>
</body>
</html>
